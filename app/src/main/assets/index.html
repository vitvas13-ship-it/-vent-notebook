<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px system-ui,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style><title>Блокнот наладчика вентиляции</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
/* Layout: штамп чертежа сверху, журнал строк ниже; одна колонка до 1080px, сетка миллиметровки на фоне */
:root{
  --paper:#EDF0F1;      /* оцинковка, светлая */
  --sheet:#FFFFFF;
  --sheet-2:#F6F8F9;
  --ink:#192026;
  --ink-2:#56616B;
  --rule:#C9D1D7;
  --grid:#E0E6E9;
  --band:#1B2228;       /* шапка — графит */
  --band-ink:#E8ECEE;
  --band-2:#2A333B;
  --signal:#F2C230;     /* сигнальный жёлтый */
  --signal-ink:#1B2228;
  --link:#1D5E8C;
  --ok:#1C7343; --ok-bg:#DDF0E3;
  --warn:#8E5B00; --warn-bg:#FAEDCC;
  --bad:#B0281F; --bad-bg:#F7DDDA;
  --f-display:"Fira Sans Extra Condensed","Arial Narrow","Roboto Condensed",sans-serif;
  --f-body:"Golos Text","Segoe UI",Roboto,Arial,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,"Cascadia Mono",Consolas,monospace;
  --r:6px;
}


*{box-sizing:border-box}
body{
  background-color:var(--paper);
  background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);
  background-size:20px 20px;
  color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.5;
}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--band)}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--link);outline-offset:2px}
.mono,.num{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
h1,h2,h3{font-family:var(--f-display);font-weight:600;letter-spacing:.01em;text-wrap:balance;margin:0;line-height:1.15}
h1{font-size:30px}
@media (max-width:640px){h1{font-size:24px}}
h2{font-size:21px}
h3{font-size:17px}
p{margin:0}
a{color:var(--link)}

/* ===== шапка ===== */
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:9;background:var(--band);color:var(--band-ink);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.bar-in{max-width:1080px;margin:0 auto;display:flex;align-items:center;gap:18px;min-height:56px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.brand-mark{width:28px;height:28px;flex:none}
.brand-name{font-family:var(--f-display);font-weight:700;font-size:20px;letter-spacing:.04em;text-transform:uppercase;white-space:nowrap}
.brand-sub{font-family:var(--f-mono);font-size:11px;color:var(--ink-2);opacity:.9;white-space:nowrap}
.bar .brand-sub{color:#9AA6AF}
.tabs{display:flex;gap:2px;margin-left:auto;background:var(--band-2);padding:3px;border-radius:8px}
.tab{border:0;background:transparent;color:var(--band-ink);font-family:var(--f-display);font-size:17px;font-weight:600;letter-spacing:.03em;
  padding:6px 14px;border-radius:6px;cursor:pointer}
.tab[aria-selected="true"]{background:var(--signal);color:var(--signal-ink)}
.save-state{font-family:var(--f-mono);font-size:12px;color:#9AA6AF;display:flex;align-items:center;gap:6px;white-space:nowrap}
.save-state i{width:8px;height:8px;border-radius:50%;background:#62CC8F;display:inline-block}
.save-state[data-s="busy"] i{background:var(--signal)}
.save-state[data-s="local"] i{background:#9AA6AF}
.save-state[data-s="err"] i{background:#F38980}
.save-state[data-s="wait"] i{background:#F0A000}
.save-state[data-s="wait"]{color:#9A5B00;font-weight:600}
.save-state[data-s="err"]{color:#C21B1B;font-weight:600}
@media (max-width:720px){
  .bar-in{gap:8px 12px;padding-block:8px}
  .tabs{order:3;width:100%;margin-left:0}
  .tab{flex:1}
  .save-state{margin-left:auto}
}

/* ===== основная колонка ===== */
.wrap{max-width:1080px;margin:0 auto;padding-block:20px 64px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.stack{display:flex;flex-direction:column;gap:16px}
.crumbs{display:flex;flex-wrap:wrap;gap:4px 8px;font-size:13px;color:var(--ink-2);align-items:center}
.crumbs button{border:0;background:none;padding:0;color:var(--link);cursor:pointer;font-size:13px;text-decoration:underline;text-underline-offset:3px}
.crumbs span.sep{opacity:.5}
.head{display:flex;gap:12px;align-items:flex-end;justify-content:space-between;flex-wrap:wrap}
.head-actions{display:flex;gap:8px;flex-wrap:wrap}
.lead{color:var(--ink-2);max-width:65ch}
.banner{border:1px solid var(--rule);background:var(--sheet-2);border-radius:var(--r);padding:10px 12px;font-size:14px;color:var(--ink-2)}
.banner.warn{background:var(--warn-bg);color:var(--warn);border-color:transparent}

.card{background:var(--sheet);border:1px solid var(--rule);border-radius:var(--r);padding:16px;min-width:0}
.card-head{display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap;margin-bottom:12px}
.card > h2{margin-bottom:12px}
.ref{font-family:var(--f-mono);font-size:11px;color:var(--ink-2);border:1px solid var(--rule);border-radius:4px;padding:1px 6px;white-space:nowrap}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:16px}
.muted{color:var(--ink-2)}
.small{font-size:13px}

/* ===== поля ===== */
.fields{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px 12px}
.fields.wide{grid-template-columns:repeat(auto-fill,minmax(220px,1fr))}
.f{display:flex;flex-direction:column;gap:4px;min-width:0}
.f.span2{grid-column:span 2}
@media (max-width:340px){.f.span2{grid-column:auto}}
.f label,.lbl{font-family:var(--f-display);font-size:13px;font-weight:600;letter-spacing:.05em;text-transform:uppercase;color:var(--ink-2)}
.f .u{text-transform:none;letter-spacing:0;font-family:var(--f-mono);font-weight:400;font-size:11px}
input[type=text],input[type=date],select,textarea{width:100%;min-width:0;background:var(--sheet-2);border:1px solid var(--rule);border-radius:5px;padding:8px 10px;min-height:40px}
input.num-in{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
textarea{min-height:64px;resize:vertical;font-family:var(--f-mono);font-size:14px}
::placeholder{color:var(--ink-2);opacity:.6;font-style:italic;font-weight:400}
input.num-in{font-weight:600}
input:focus,select:focus,textarea:focus{border-color:var(--link);background:var(--sheet)}
.hint{font-size:12px;color:var(--ink-2)}
.pre{display:flex;align-items:stretch}
.pre span{display:flex;align-items:center;padding:0 10px;border:1px solid var(--rule);border-right:0;border-radius:5px 0 0 5px;background:var(--sheet);font-family:var(--f-mono);font-weight:600}
.pre input{border-radius:0 5px 5px 0}
.pre .sgn{min-width:44px;border:1px solid var(--rule);border-right:0;border-radius:5px 0 0 5px;background:var(--sheet);font-family:var(--f-mono);font-weight:700;font-size:18px;cursor:pointer;color:var(--ink)}
.seg{display:inline-flex;border:1px solid var(--rule);border-radius:6px;overflow:hidden;background:var(--sheet-2)}
.seg button{border:0;background:transparent;padding:7px 12px;cursor:pointer;font-size:14px}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--sheet)}
.check{display:flex;gap:8px;align-items:center;font-size:14px;cursor:pointer}

/* ===== кнопки ===== */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:38px;padding:7px 14px;border-radius:6px;
  border:1px solid var(--rule);background:var(--sheet);cursor:pointer;font-size:14px;font-weight:500;white-space:nowrap}
.btn:hover{border-color:var(--ink-2)}
.btn.primary{background:var(--signal);border-color:var(--signal);color:var(--signal-ink);font-weight:600}
.btn.primary:hover{filter:brightness(.96)}
.btn.danger{color:var(--bad)}
.btn.danger.armed{background:var(--bad);color:var(--sheet);border-color:var(--bad)}
.btn.sm{min-height:32px;padding:4px 10px;font-size:13px}
.linkbtn{border:0;background:none;color:var(--link);cursor:pointer;padding:0;font-size:14px;text-decoration:underline;text-underline-offset:3px}

/* ===== статусы ===== */
.pill{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;font-weight:600;padding:3px 9px;border-radius:999px;white-space:nowrap;background:var(--sheet-2);color:var(--ink-2);border:1px solid var(--rule)}
.pill::before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor}
.pill.ok{background:var(--ok-bg);color:var(--ok);border-color:transparent}
.pill.bad{background:var(--bad-bg);color:var(--bad);border-color:transparent}
.pill.warn{background:var(--warn-bg);color:var(--warn);border-color:transparent}
.notes{display:flex;flex-direction:column;gap:6px;margin:0;padding:0;list-style:none}
.notes li{font-size:13.5px;padding:6px 10px;border-radius:5px;background:var(--sheet-2);border-left:3px solid var(--rule)}
.notes li.w{background:var(--warn-bg);border-left-color:var(--warn);color:var(--ink)}
.notes li.b{background:var(--bad-bg);border-left-color:var(--bad);color:var(--ink)}

/* ===== штамп (title block) ===== */
.stamp{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));border:2px solid var(--ink);background:var(--sheet);border-radius:2px;overflow:hidden}
.stamp .c{border-right:1px solid var(--ink);border-bottom:1px solid var(--ink);margin:0 -1px -1px 0;padding:6px 8px 8px;display:flex;flex-direction:column;gap:2px;min-width:0}
.stamp .c.s2{grid-column:span 2}.stamp .c.s3{grid-column:span 3}.stamp .c.s4{grid-column:span 4}.stamp .c.s6{grid-column:span 6}
.stamp .c label{font-family:var(--f-display);font-size:11.5px;font-weight:600;letter-spacing:.07em;text-transform:uppercase;color:var(--ink-2)}
.stamp input,.stamp select{border:0;background:transparent;padding:2px 0;min-height:30px;border-radius:0;font-size:16px}
.stamp input:focus,.stamp select:focus{background:var(--sheet-2);outline:none;box-shadow:inset 0 -2px 0 var(--signal)}
.stamp .c.title input{font-family:var(--f-display);font-size:26px;font-weight:700;letter-spacing:.02em}
@media (max-width:720px){
  .stamp{grid-template-columns:repeat(2,minmax(0,1fr))}
  .stamp .c,.stamp .c.s2,.stamp .c.s3,.stamp .c.s4,.stamp .c.s6{grid-column:span 2}
  .stamp .c.half{grid-column:span 1}
}

/* ===== карточки объектов ===== */
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:14px}
.ocard{text-align:left;cursor:pointer;display:flex;flex-direction:column;gap:10px;background:var(--sheet);border:1px solid var(--rule);border-radius:var(--r);padding:14px 16px;min-width:0}
.ocard:hover{border-color:var(--ink-2)}
.ocard h3{font-size:20px}
.ocard .meta{font-size:13px;color:var(--ink-2)}
.ocard .row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.empty{border:1.5px dashed var(--rule);border-radius:var(--r);padding:28px 20px;display:flex;flex-direction:column;gap:14px;background:var(--sheet);align-items:flex-start}
.empty h2{font-size:24px}

/* ===== таблицы ===== */
.tbl-wrap{overflow-x:auto;border:1px solid var(--rule);border-radius:var(--r);background:var(--sheet)}
table{border-collapse:collapse;width:100%;font-size:14px}
th{font-family:var(--f-display);font-weight:600;font-size:13px;letter-spacing:.04em;text-transform:uppercase;color:var(--ink-2);text-align:left;padding:8px 10px;border-bottom:1px solid var(--rule);background:var(--sheet-2);white-space:nowrap}
td{padding:7px 10px;border-bottom:1px solid var(--grid);vertical-align:middle}
tr:last-child td{border-bottom:0}
td.r,th.r{text-align:right}
tr.click{cursor:pointer}
th.cc{text-align:center}
.systbl th{white-space:normal;vertical-align:bottom}
.dv{font-weight:600}.dv.ok{color:var(--ok)}.dv.bad{color:var(--bad)}
.systbl th[rowspan]{vertical-align:middle}
@media (max-width:480px){.systbl th,.systbl td{padding:6px 4px}.systbl th{font-size:11px;letter-spacing:.02em}.systbl td{font-size:13px}}
@media (max-width:640px){th.hm,td.hm{display:none}th.sz,td.sz{font-size:12px}.sectbl th{white-space:normal;font-size:11px;padding:6px 4px;vertical-align:bottom}.sectbl td{padding:6px 4px;font-size:13px}.sectbl td.sz{white-space:nowrap}td.sz .kt{display:block;width:max-content;margin-top:2px}}
tr.click:hover td{background:var(--sheet-2)}
.rd td{padding:4px 6px}
.rd input{min-height:36px;padding:6px 8px;width:76px;text-align:right}
.rd td.pt{font-family:var(--f-mono);font-weight:600;white-space:nowrap}
.rd tr.on td.pt{color:var(--ink)}
.rd .spr.bad{color:var(--bad);font-weight:600}
.rd .co{display:block;font-family:var(--f-mono);font-size:11px;font-weight:400;color:var(--ink-2);white-space:nowrap}
.rd td.vcell{white-space:nowrap}
@media (max-width:480px){.rd input{width:58px;padding:6px 6px}.rd td{padding:4px 3px}.rd th{padding:6px 4px;font-size:11.5px;white-space:normal}}

/* ===== результат сечения ===== */
.result{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));border:2px solid var(--ink);background:var(--sheet);border-radius:2px}
.result .c{padding:10px 12px;border-right:1px solid var(--rule);min-width:0;display:flex;flex-direction:column;gap:2px}
.result .c:last-child{border-right:0}
.result .k{font-family:var(--f-display);font-size:12px;font-weight:600;letter-spacing:.07em;text-transform:uppercase;color:var(--ink-2)}
.result .v{font-family:var(--f-mono);font-size:26px;font-weight:600;line-height:1.1;font-variant-numeric:tabular-nums}
.result .v small{font-size:13px;font-weight:400;color:var(--ink-2)}
.result .c.st{justify-content:center;align-items:flex-start;gap:6px}
.subline{display:flex;flex-wrap:wrap;gap:6px 18px;font-size:13px;color:var(--ink-2);padding:8px 2px 0}
.subline b{font-family:var(--f-mono);color:var(--ink);font-weight:500}
@media (max-width:640px){
  .result{grid-template-columns:repeat(2,minmax(0,1fr))}
  .result .c:nth-child(2){border-right:0}
  .result .c:nth-child(-n+2){border-bottom:1px solid var(--rule)}
  .result .v{font-size:22px}
}

/* ===== схема сечения ===== */
.diagram{display:flex;gap:16px;flex-wrap:wrap;align-items:flex-start}
.diagram .dsvg{flex:none;width:220px;max-width:100%}
.diagram .dsvg svg{width:100%;height:auto;display:block}
.diagram .dtable{flex:1 1 360px;min-width:0}
@media (max-width:640px){.diagram .dsvg{width:180px;margin:0 auto}}
.sv-wall{fill:var(--sheet-2);stroke:var(--ink);stroke-width:2}
.sv-axis{stroke:var(--ink-2);stroke-width:1;stroke-dasharray:4 3}
.sv-pt{fill:var(--sheet);stroke:var(--ink);stroke-width:1.6}
.sv-pt.on{fill:var(--signal);stroke:var(--ink)}
.sv-txt{fill:var(--ink-2);font-family:var(--f-mono);font-size:10px}
.sv-hole{fill:var(--signal);stroke:var(--ink);stroke-width:1}
.sv-hole.dim,.sv-pt.dim{opacity:.35}
.drilltbl th{white-space:normal;text-align:center}
.drilltbl th.gh,.drilltbl td.hl1{background:var(--t-point)}
.drilltbl th.gh{color:var(--h-point)}
.drilltbl th.gd,.drilltbl td.dp{background:var(--t-meas)}
.drilltbl th.gd{color:var(--h-meas)}
.drilltbl .first{border-left:3px solid var(--ink)}
.drilltbl td.dp{font-weight:700;font-size:16px}
.drilltbl td,.drilltbl th{padding-left:6px;padding-right:6px}
.sv-path{stroke:var(--ink);stroke-width:1.4;stroke-dasharray:5 3}
.geo{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 14px;font-size:14px;align-content:start}
.geo dt{color:var(--ink-2)}
.geo dd{margin:0;font-family:var(--f-mono);text-align:right;white-space:nowrap}

/* ===== расчёты ===== */
.jump{display:flex;flex-wrap:wrap;gap:6px}
.jump button{border:1px solid var(--rule);background:var(--sheet);border-radius:999px;padding:4px 11px;font-size:13px;cursor:pointer}
.jump button:hover{border-color:var(--ink-2)}
.calc{scroll-margin-top:120px}
.calc .formula{font-family:var(--f-mono);font-size:12.5px;color:var(--ink-2);background:var(--sheet-2);border-radius:4px;padding:6px 8px;margin-top:10px;overflow-x:auto;white-space:nowrap}
.out{margin-top:14px;display:flex;flex-direction:column;gap:10px}
.kv{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px}
.kv .i{border:1px solid var(--rule);border-radius:5px;padding:7px 10px;background:var(--sheet-2);min-width:0}
.kv .i .k{font-size:12.5px;color:var(--ink-2)}
.kv .i .v{font-family:var(--f-mono);font-size:18px;font-weight:600;font-variant-numeric:tabular-nums}
.kv .i .v small{font-size:12px;font-weight:400;color:var(--ink-2)}
.kv .i.hl{background:var(--sheet);border-color:var(--ink)}

/* ===== нормы ===== */
.norms h2{margin-bottom:10px}
.norms ul{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:6px;max-width:80ch}
.norms li{padding-left:2px}
.norms .cl{font-family:var(--f-mono);font-size:12px;color:var(--ink-2);white-space:nowrap}
.norms table td:first-child{min-width:220px}

/* ===== оверлей и тост ===== */
.overlay{position:fixed;inset:0;z-index:30;background:rgba(10,13,16,.55);display:flex;align-items:flex-start;justify-content:center;overflow:auto;
  padding:max(24px,env(safe-area-inset-top,0px)) max(12px,env(safe-area-inset-right,0px)) 24px max(12px,env(safe-area-inset-left,0px))}
.sheet{background:var(--sheet);border-radius:8px;max-width:900px;width:100%;padding:16px;display:flex;flex-direction:column;gap:12px}
.sheet .doc{background:#fff;color:#111;border:1px solid var(--rule);padding:16px;overflow-x:auto;font-family:Arial,sans-serif;font-size:13px}
.sheet .doc h1{font-family:Arial,sans-serif;font-size:17px;text-align:center;margin:0 0 10px;color:#111}
.sheet .doc h2{font-family:Arial,sans-serif;font-size:14px;margin:12px 0 4px;color:#111}
.sheet .doc p{margin:3px 0}
.sheet .doc table{font-size:12px;border-collapse:collapse;width:100%;margin:4px 0}
.sheet .doc .hd td{border:0;border-bottom:1px solid #888}
.sheet .doc td.r{text-align:right}
.sheet .doc .sg .ln{border-bottom:1px solid #111;min-height:18px;margin-top:6px}
.sheet .doc .sg .cap{font-size:10px;text-align:center;color:#444}
.sheet .doc th,.sheet .doc td{border:1px solid #888;color:#111;background:#fff;padding:4px 6px;text-transform:none;letter-spacing:0;font-family:Arial,sans-serif}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(16px + env(safe-area-inset-bottom,0px));z-index:40;background:var(--band);color:var(--band-ink);
  padding:10px 16px;border-radius:8px;font-size:14px;max-width:min(92vw,520px);box-shadow:0 6px 24px rgba(0,0,0,.25)}
@media (prefers-reduced-motion:no-preference){
  .toast{animation:tin .18s ease-out}
  @keyframes tin{from{opacity:0;transform:translate(-50%,6px)}to{opacity:1;transform:translate(-50%,0)}}
}
.phs{display:flex;flex-wrap:wrap;gap:10px}
.ph{width:96px;height:96px;border:1px solid var(--rule);border-radius:6px;padding:0;overflow:hidden;background:var(--sheet-2);cursor:pointer;flex:none}
.ph img{width:100%;height:100%;object-fit:cover;display:block}
.ph.add{border:1.5px dashed var(--ink-2);display:flex;align-items:center;justify-content:center;text-align:center;font-weight:600;font-size:14px;line-height:1.3;color:var(--ink)}
.ph.add small{font-weight:400;color:var(--ink-2)}
.ph-full{max-width:100%;max-height:75vh;object-fit:contain;display:block;margin:0 auto;border-radius:4px;background:var(--sheet-2)}
.sheet .doc .figs{display:flex;flex-wrap:wrap;gap:8px}.sheet .doc figure{margin:0;width:calc(50% - 4px)}.sheet .doc figure img{width:100%}
.vh{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

<script>
(function(){
"use strict";
/* ===== Расчётное ядро: ГОСТ 12.3.018-79 и ГОСТ 34060-2017 ===== */
const M = (() => {
  const num = (v) => {
    if (typeof v === 'number') return v;
    if (v === null || v === undefined) return NaN;
    const s = String(v).trim().replace(/\s/g, '').replace(',', '.');
    if (s === '' || s === '-' || s === '.') return NaN;
    const n = Number(s);
    return Number.isFinite(n) ? n : NaN;
  };
  const ok = (x) => Number.isFinite(x);
  const mean = (a) => { const f = a.filter(ok); return f.length ? f.reduce((s, x) => s + x, 0) / f.length : NaN; };

  function interp(xs, ys, x) {
    if (x <= xs[0]) return ys[0];
    if (x >= xs[xs.length - 1]) return ys[ys.length - 1];
    for (let i = 1; i < xs.length; i++) {
      if (x <= xs[i]) { const t = (x - xs[i - 1]) / (xs[i] - xs[i - 1]); return ys[i - 1] + t * (ys[i] - ys[i - 1]); }
    }
    return NaN;
  }

  /* ГОСТ 12.3.018, табл. 1 — коэффициент Kφ */
  const KPHI_T = [10, 20, 30, 40, 50];
  const KPHI_50 = [0.998, 1.000, 1.004, 1.010, 1.020];
  const KPHI_100 = [1.003, 1.005, 1.012, 1.025, 1.040];
  function kPhi(t, phi) {
    if (!ok(t)) return NaN;
    const p = ok(phi) ? Math.min(100, Math.max(50, phi)) : 50;
    const k50 = interp(KPHI_T, KPHI_50, t), k100 = interp(KPHI_T, KPHI_100, t);
    return k50 + (k100 - k50) * (p - 50) / 50;
  }
  /* п. 5.3: ρ = (Ba + p′) / (R·Kφ·(t + 273)); Ba в кПа, p′ в Па */
  function density(BakPa, pPa, t, phi) {
    const K = kPhi(t, phi);
    const B = num(BakPa) * 1000 + (ok(num(pPa)) ? num(pPa) : 0);
    if (!ok(B) || !ok(t) || !ok(K)) return NaN;
    return B / (287 * K * (t + 273));
  }

  /* Геометрия мерного сечения, мм → м² */
  function geom(shape, D, a, b) {
    if (shape === 'round') {
      if (!(D > 0)) return { F: NaN, Dh: NaN };
      return { F: Math.PI * D * D / 4 / 1e6, Dh: D, P: Math.PI * D };
    }
    if (!(a > 0 && b > 0)) return { F: NaN, Dh: NaN };
    return { F: a * b / 1e6, Dh: 2 * a * b / (a + b), P: 2 * (a + b) };
  }

  /* Черт. 1 и 2 — координаты точек измерения */
  function points(shape, D, a, b) {
    const res = { z: 0, pts: [], note: '', rule: '' };
    if (shape === 'round') {
      if (!(D > 0)) return res;
      let rel;
      if (D < 100) { rel = [0.5]; res.note = 'D < 100 мм: черт. 1 точки не задаёт, принята одна точка в центре.'; res.rule = 'центр'; }
      else if (D <= 300) { rel = [0.12, 0.88]; res.rule = '100 ≤ D ≤ 300 мм: 4 точки, 0,12D от стенки'; }
      else { rel = [0.054, 0.28, 0.72, 0.946]; res.rule = 'D > 300 мм: 8 точек, 0,054D и 0,28D от стенки'; }
      const axes = rel.length === 1 ? ['Ц'] : ['Г', 'В'];
      axes.forEach((ax) => rel.forEach((r, i) => {
        const pos = r; // доля диаметра от стенки
        const x = ax === 'В' ? 0.5 : pos, y = ax === 'В' ? pos : 0.5;
        res.pts.push({ label: ax === 'Ц' ? 'Ц' : ax + (i + 1), axis: ax, depth: r * D, rel: r, x, y });
      }));
    } else {
      if (!(a > 0 && b > 0)) return res;
      let xs, ys;
      if (b < 100) { xs = [0.5]; ys = [0.5]; res.note = 'b < 100 мм: черт. 2 точки не задаёт, принята одна точка в центре.'; res.rule = 'центр'; }
      else if (b <= 200) { xs = [0.2, 0.8]; ys = [0.2, 0.8]; res.rule = '100 ≤ b ≤ 200 мм: 4 точки, 0,2a и 0,2b от стенок'; }
      else { xs = [0.1, 0.4, 0.6, 0.9]; ys = [0.1, 0.4, 0.6, 0.9]; res.rule = 'b > 200 мм: 16 точек, 0,1 и 0,4 от стенок'; }
      xs.forEach((x, i) => ys.forEach((y, j) => {
        res.pts.push({ label: (i + 1) + '.' + (j + 1), hole: i + 1, x, y, xmm: x * a, depth: y * b });
      }));
    }
    res.z = res.pts.length;
    return res;
  }

  /* Одно значение в точке (прибор усредняет сам). Старые записи-массивы — берём первое. */
  const first = (x) => (Array.isArray(x) ? x[0] : x);
  function pointStats(raw, kind, rho) {
    const x = num(first(raw));
    const out = { n: ok(x) ? 1 : 0, v: NaN, pd: NaN, neg: false };
    if (!ok(x)) return out;
    if (kind === 'pitot') { out.neg = x < 0; out.pd = x; out.v = Math.sqrt(2 * Math.max(0, x) / rho); }
    else out.v = x;
    return out;
  }

  /* Допуски ГОСТ 34060-2026 (проект): п. 8.2.5 — сеть и устройства ±10 %, отсосы и душирование 0…+8 %;
     п. 10.2.6 — вентилятор 5 %. Решётки одного помещения одной системы — см. ROOM ниже. */
  const ROLES = {
    terminal: { name: 'Воздухораспределитель / воздухоприёмник', short: 'Решётка', tol: [-10, 10], ref: 'ГОСТ 34060-2026, п. 8.2.5' },
    local: { name: 'Местный отсос', short: 'Отсос', tol: [0, 8], ref: 'ГОСТ 34060-2026, п. 8.2.5' },
    shower: { name: 'Душирующее устройство', short: 'Душ', tol: [0, 8], ref: 'ГОСТ 34060-2026, п. 8.2.5' },
    branch: { name: 'Ответвление', short: 'Ответвл.', tol: [-10, 10], ref: 'ГОСТ 34060-2026, п. 8.2.5' },
    main: { name: 'Магистраль (общая контрольная точка)', short: 'Магистр.', tol: [-10, 10], ref: 'ГОСТ 34060-2026, п. 8.2.5' },
    fan_in: { name: 'Вентилятор — всасывание', short: 'Вент. вс.', tol: [-5, 5], ref: 'ГОСТ 34060-2026, п. 10.2.6' },
    fan_out: { name: 'Вентилятор — нагнетание', short: 'Вент. нагн.', tol: [-5, 5], ref: 'ГОСТ 34060-2026, п. 10.2.6' },
  };
  /* Решётки в одном помещении, одна система: каждая ±20 %, если сумма по помещению в пределах ±10 % */
  const ROOM = { each: [-20, 20], sum: 10, ref: 'ГОСТ 34060-2026, п. 8.2.5' };
  const roomKey = (x) => String(x || '').trim().toLowerCase().replace(/ё/g, 'е').replace(/\s+/g, ' ');
  const METHODS = {
    pitot: 'Воздуховод: трубка Пито',
    anemo: 'Воздуховод: анемометр / термоанемометр',
    grille: 'Решётка, проём: анемометр',
    hood: 'Воронка Testo',
    kfactor: 'Вентилятор: K-фактор',
  };

  function devStatus(dev, tol) {
    if (!ok(dev)) return 'none';
    return dev >= tol[0] - 1e-9 && dev <= tol[1] + 1e-9 ? 'ok' : 'bad';
  }

  /* Полный расчёт мерного сечения */
  /* Старый расчёт по точкам — только для переноса ранних записей */
  function sectionPoints(sec, BakPa) {
    const r = { warn: [], info: [] };
    const D = num(sec.D), a = num(sec.a), b = num(sec.b);
    const method = sec.method || 'pitot';
    const g = geom(sec.shape, D, a, b);
    r.F = g.F; r.Dh = g.Dh;
    const t = ok(num(sec.t)) ? num(sec.t) : 20;
    const phi = ok(num(sec.phi)) ? num(sec.phi) : 50;
    r.rho = density(BakPa, sec.ps, t, phi);
    if (!ok(r.rho)) r.rho = 1.2;
    r.Lp = num(sec.Lp);
    const role = ROLES[sec.role] || ROLES.terminal;
    r.tol = role.tol;

    if (method === 'hood') {
      r.L = num(first(sec.hood));
    } else if (sec.entry === 'total') {
      /* Общий расход по прибору (Testo считает сам) */
      r.total = true;
      r.L = num(first(sec.total));
      let Fc = g.F;
      if (method === 'grille') { const kf = num(sec.kFree); if (ok(kf) && kf > 0 && ok(Fc)) Fc *= kf; r.Fcalc = Fc; }
      if (ok(r.L) && ok(Fc) && Fc > 0) r.v = r.L / 3600 / Fc;
      if (ok(r.v)) r.pd = r.rho * r.v * r.v / 2;
    } else if (method === 'grille') {
      const kf = num(sec.kFree), fFree = num(sec.fFree);
      let Fc = g.F;
      if (ok(fFree) && fFree > 0) Fc = fFree; else if (ok(kf) && kf > 0 && ok(Fc)) Fc = Fc * kf;
      r.Fcalc = Fc;
      r.v = num(first(sec.grille));
      r.L = ok(r.v) && ok(Fc) ? 3600 * r.v * Fc : NaN;
      if (ok(r.v)) r.pd = r.rho * r.v * r.v / 2;
    } else {
      const P = points(sec.shape, D, a, b);
      r.pts = P; r.z = P.z;
      if (P.note) r.info.push(P.note);
      const stats = P.pts.map((_, i) => pointStats((sec.readings || [])[i], method, r.rho));
      r.stats = stats;
      const filled = stats.filter((s) => s.n > 0);
      r.filled = filled.length;
      if (filled.length) {
        if (method === 'pitot') {
          const sq = filled.map((s) => Math.sqrt(Math.max(0, s.pd)));
          r.pd = Math.pow(sq.reduce((x, y) => x + y, 0) / filled.length, 2);
          r.v = Math.sqrt(2 * r.pd / r.rho);
        } else {
          r.v = mean(filled.map((s) => s.v));
          r.pd = r.rho * r.v * r.v / 2;
        }
        r.L = ok(g.F) ? 3600 * g.F * r.v : NaN;
        if (filled.length < P.z) r.warn.push(`Заполнено ${filled.length} из ${P.z} точек — расход предварительный.`);
        if (stats.some((s) => s.neg)) r.warn.push('Есть отрицательные Pд: проверьте ориентацию трубки.');
      }
    }
    r.ptot = ok(num(sec.ps)) && ok(r.pd) ? num(sec.ps) + r.pd : NaN;
    r.dev = ok(r.L) && ok(r.Lp) && r.Lp > 0 ? (r.L - r.Lp) / r.Lp * 100 : NaN;
    r.status = !ok(r.L) ? 'none' : (ok(r.dev) ? devStatus(r.dev, role.tol) : 'none');
    return r;
  }

  /* K нужен воздухораспределителям, местным отсосам, душам и решёткам; у воронки его нет */
  function usesK(sec) { return sec.method !== 'hood' && sec.method !== 'kfactor' && (sec.method === 'grille' || ['terminal', 'local', 'shower'].includes(sec.role || 'terminal')); }

  /* Мерное сечение: вписывается среднее с прибора — V факт (м/с) или L факт (м³/ч) */
  function section(sec, BakPa) {
    const r = { warn: [], info: [] };
    const method = sec.method || '';
    const g = geom(sec.shape, num(sec.D), num(sec.a), num(sec.b));
    r.F = g.F; r.Dh = g.Dh;
    let Fc = g.F;
    if (method === 'hood' || method === 'kfactor') Fc = NaN;
    r.Fcalc = Fc;
    /* Поправочный K решётки (по умолчанию 1): учитывается при вводе V факт, при вводе L факт — нет */
    const kf = num(sec.kFree);
    r.kOn = usesK(sec);
    r.k = r.kOn && ok(kf) && kf > 0 ? kf : 1;
    const t = ok(num(sec.t)) ? num(sec.t) : 20;
    /* На всасывании Pст — разрежение: знак минус ставится сам */
    const ps0 = num(sec.ps);
    r.ps = ok(ps0) ? (sec.role === 'fan_in' || sec.psSign === '-' ? -Math.abs(ps0) : ps0) : NaN;
    r.rho = density(BakPa, ok(r.ps) ? r.ps : 0, t, 50);
    if (!ok(r.rho)) r.rho = 1.2;
    r.Lp = num(sec.Lp);
    const role = ROLES[sec.role] || ROLES.terminal;
    r.tol = role.tol;
    r.byL = method === 'hood' || sec.entry === 'L';
    r.kfMode = method === 'kfactor' && !r.byL;
    if (r.kfMode) {
      /* Расход вентилятора по K-фактору: L = K · √Δp (Δp на входном коллекторе, Па; K — с шильдика) */
      r.kFan = num(sec.kFan); r.dpK = num(first(sec.dpK));
      r.L = ok(r.kFan) && r.kFan > 0 && ok(r.dpK) && r.dpK >= 0 ? r.kFan * Math.sqrt(r.dpK) : NaN;
      if (ok(r.dpK) && !(ok(r.kFan) && r.kFan > 0)) r.warn.push('Впишите K-фактор с шильдика или из паспорта вентилятора.');
      if (ok(r.dpK) && r.dpK < 0) r.warn.push('Δp на коллекторе должен быть положительным.');
    } else if (r.byL) {
      const Lraw = num(first(sec.total));
      r.L = Lraw;
      if (ok(Lraw) && ok(Fc) && Fc > 0) r.v = Lraw / 3600 / Fc;
    } else {
      r.v = num(first(sec.vAvg));
      r.L = ok(r.v) && ok(Fc) ? 3600 * r.v * Fc * r.k : NaN;
      if (ok(r.v) && !ok(Fc)) r.warn.push('Задайте размеры сечения — по ним скорость пересчитается в расход.');
    }
    if (ok(r.v)) r.pd = r.rho * r.v * r.v / 2;
    r.ptot = ok(r.ps) && ok(r.pd) ? r.ps + r.pd : NaN;
    r.dev = ok(r.L) && ok(r.Lp) && r.Lp > 0 ? (r.L - r.Lp) / r.Lp * 100 : NaN;
    r.status = !ok(r.L) ? 'none' : (ok(r.dev) ? devStatus(r.dev, role.tol) : 'none');
    return r;
  }

  /* Перенос записей ранних версий (замеры по точкам, воронка) в V факт / L факт */
  function migrate(sec, BakPa) {
    if (sec.v2) return false;
    if (sec.entry === 'total') sec.entry = 'L';
    else if (sec.method === 'hood') { sec.entry = 'L'; if (!String(first(sec.total) ?? '').trim() && sec.hood) sec.total = first(sec.hood); }
    else if (sec.entry !== 'L') {
      if (!String(first(sec.vAvg) ?? '').trim()) {
        if (sec.method === 'grille' && String(first(sec.grille) ?? '').trim()) sec.vAvg = first(sec.grille);
        else if ((sec.readings || []).some((x) => ok(num(first(x))))) {
          const old = sectionPoints(sec, BakPa);
          if (ok(old.v)) sec.vAvg = String(Math.round(old.v * 100) / 100).replace('.', ',');
        }
      }
      sec.entry = 'V';
    }
    sec.v2 = 1;
    return true;
  }

  /* Итоги по системе: подсосы (п. 11.3.5), вентилятор (п. 11.2) */
  function system(sys) {
    const B = num(sys.Ba);
    const secs = (sys.sections || []).map((s) => ({ s, r: section(s, ok(B) ? B : 101.3) }));
    const out = { secs, count: secs.length, okN: 0, badN: 0, noneN: 0, rooms: [] };
    /* помещения: две и более решётки с одинаковым «Помещением» */
    const groups = new Map();
    secs.forEach((it) => {
      const k = (it.s.role || 'terminal') === 'terminal' ? roomKey(it.s.room) : '';
      if (!k) return;
      if (!groups.has(k)) groups.set(k, []);
      groups.get(k).push(it);
    });
    groups.forEach((items) => {
      if (items.length < 2) return;
      const room = { name: String(items[0].s.room).trim(), n: items.length, ids: items.map(({ s }) => s.id) };
      room.m = items.filter(({ r }) => ok(r.L)).length;
      room.L = items.reduce((a, { r }) => a + (ok(r.L) ? r.L : 0), 0);
      room.Lp = items.reduce((a, { r }) => a + (ok(r.Lp) ? r.Lp : 0), 0);
      room.complete = room.m === room.n && items.every(({ r }) => ok(r.Lp));
      room.dev = room.complete && room.Lp > 0 ? (room.L - room.Lp) / room.Lp * 100 : NaN;
      room.ok = ok(room.dev) && Math.abs(room.dev) <= ROOM.sum + 1e-9;
      room.status = !ok(room.dev) ? 'none' : (room.ok ? 'ok' : 'bad');
      items.forEach(({ r }) => {
        r.room = room;
        if (room.ok) { r.tol = ROOM.each; r.status = !ok(r.L) ? 'none' : (ok(r.dev) ? devStatus(r.dev, r.tol) : 'none'); }
      });
      out.rooms.push(room);
    });
    secs.forEach(({ r }) => { if (r.status === 'ok') out.okN++; else if (r.status === 'bad') out.badN++; else out.noneN++; });
    const term = secs.filter(({ s }) => ['terminal', 'local', 'shower'].includes(s.role));
    const main = secs.filter(({ s, r }) => s.role === 'main' && ok(r.L));
    out.sumTermL = term.reduce((x, { r }) => x + (ok(r.L) ? r.L : 0), 0);
    out.sumTermLp = term.reduce((x, { r }) => x + (ok(r.Lp) ? r.Lp : 0), 0);
    out.termN = term.length;
    out.termFilled = term.filter(({ r }) => ok(r.L)).length;
    if (main.length && out.termFilled) {
      out.mainL = main[0].r.L;
      out.leak = out.mainL - out.sumTermL;
      out.leakPct = out.leak / out.mainL * 100;
      out.leakOk = Math.abs(out.leakPct) <= 8;
    }
    const fin = secs.find(({ s, r }) => s.role === 'fan_in' && ok(r.L));
    const fout = secs.find(({ s, r }) => s.role === 'fan_out' && ok(r.L));
    if (fin || fout) {
      const Ls = [fin, fout].filter(Boolean).map(({ r }) => r.L);
      out.fanL = mean(Ls);
      if (fin && fout && ok(fin.r.ptot) && ok(fout.r.ptot)) out.fanP = fout.r.ptot - fin.r.ptot;
      const fp = (sys.pass && sys.pass.fan && sys.pass.fan.proj) || {};
      const Lpr = num(fp.L), Ppr = num(fp.P);
      if (ok(Lpr) && Lpr > 0) { out.fanLdev = (out.fanL - Lpr) / Lpr * 100; }
      if (ok(Ppr) && Ppr > 0 && ok(out.fanP)) { out.fanPdev = (out.fanP - Ppr) / Ppr * 100; }
    }
    return out;
  }

  function fmt(x, d = 0) {
    if (!ok(x)) return '—';
    return x.toLocaleString('ru-RU', { minimumFractionDigits: d, maximumFractionDigits: d });
  }
  function fmtSigned(x, d = 1) { if (!ok(x)) return '—'; const s = fmt(Math.abs(x), d); return (x > 0 ? '+' : x < 0 ? '−' : '±') + s; }

  return {
    num, ok, mean, interp, kPhi, density, geom, points, pointStats, section, migrate, usesK, system, ROLES, METHODS,
    devStatus, fmt, fmtSigned, ROOM, roomKey };
})();
if (typeof module !== 'undefined') module.exports = M;

/* ===== утилиты ===== */
const $ = (s, el = document) => el.querySelector(s);
const $$ = (s, el = document) => Array.from(el.querySelectorAll(s));
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const newId = (p) => p + Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
const clone = (o) => JSON.parse(JSON.stringify(o));
const N = M.num, F = M.fmt, OK = M.ok;
const LS_DOCS = 'vnb.docs.v1';
const LS_CALC = 'vnb.calc.v1';
const LS_UI = 'vnb.ui.v1';
const LS_METHOD = 'vnb.method.v1';
function lsGet(k) { try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : null; } catch (e) { return null; } }
function lsSet(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); return true; } catch (e) { return false; } }
function todayISO() { const d = new Date(); return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0'); }
function fmtDate(iso) { if (!iso) return '—'; const [y, m, d] = String(iso).split('-'); return d && m && y ? `${d}.${m}.${y}` : iso; }
const natCmp = (a, b) => String(a).localeCompare(String(b), 'ru', { numeric: true, sensitivity: 'base' });

let toastTimer = null;
function toast(msg) {
  const root = $('#toast-root');
  root.innerHTML = `<div class="toast" role="status">${esc(msg)}</div>`;
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => { root.innerHTML = ''; }, 3200);
}

/* ===== память телефона: IndexedDB (записи, очередь отправки, фото) ===== */
const Local = {
  db: null, ok: false,
  open() {
    return new Promise((res) => {
      let done = false; const fin = (v) => { if (!done) { done = true; res(v); } };
      try {
        if (!window.indexedDB) { fin(false); return; }
        const rq = indexedDB.open('vnb-notebook', 1);
        rq.onupgradeneeded = () => {
          const d = rq.result;
          if (!d.objectStoreNames.contains('docs')) d.createObjectStore('docs', { keyPath: 'id' });
          if (!d.objectStoreNames.contains('meta')) d.createObjectStore('meta');
          if (!d.objectStoreNames.contains('blobs')) d.createObjectStore('blobs');
        };
        rq.onsuccess = () => { this.db = rq.result; this.ok = true; fin(true); };
        rq.onerror = () => fin(false);
        rq.onblocked = () => fin(false);
        setTimeout(() => fin(false), 5000);
      } catch (e) { fin(false); }
    });
  },
  req(store, mode, fn) {
    return new Promise((res, rej) => {
      try {
        const t = this.db.transaction(store, mode);
        const r = fn(t.objectStore(store));
        t.oncomplete = () => res(r ? r.result : undefined);
        t.onerror = () => rej(t.error); t.onabort = () => rej(t.error);
      } catch (e) { rej(e); }
    });
  },
  allDocs() { return this.req('docs', 'readonly', (s) => s.getAll()); },
  putDoc(d) { return this.req('docs', 'readwrite', (s) => s.put(d)); },
  delDoc(id) { return this.req('docs', 'readwrite', (s) => s.delete(id)); },
  getMeta(k) { return this.req('meta', 'readonly', (s) => s.get(k)); },
  setMeta(k, v) { return this.req('meta', 'readwrite', (s) => s.put(v, k)); },
  putBlob(k, b) { return this.req('blobs', 'readwrite', (s) => s.put(b, k)); },
  getBlob(k) { return this.req('blobs', 'readonly', (s) => s.get(k)); },
  delBlob(k) { return this.req('blobs', 'readwrite', (s) => s.delete(k)); },
  blobKeys() { return this.req('blobs', 'readonly', (s) => s.getAllKeys()); },
};

/* ===== журнал: сначала в память телефона, потом — в облако, когда есть сеть =====
   mode 'local' — только телефон (нет облака: офлайн-файл или нет входа);
   mode 'db'    — телефон + облако (личный раздел блокнота). */
const Store = {
  mode: 'init', ready: false, docs: new Map(), listeners: [],
  pending: new Set(), pendingDel: new Set(), inflight: new Set(), again: new Set(), timers: {},
  col: null, cloud: 'none', offline: false, lsOnly: false, broken: false,

  async init() {
    const ok = await Local.open();
    let docs = [];
    if (ok) {
      try { docs = (await Local.allDocs()) || []; } catch (e) { docs = []; }
      try { ((await Local.getMeta('pending')) || []).forEach((id) => this.pending.add(id)); } catch (e) { /* пусто */ }
      try { ((await Local.getMeta('pendingDel')) || []).forEach((id) => this.pendingDel.add(id)); } catch (e) { /* пусто */ }
    } else {
      this.lsOnly = true;
    }
    /* перенос записей прежних версий из localStorage */
    const legacy = lsGet(LS_DOCS);
    if (legacy && Array.isArray(legacy.docs)) {
      legacy.docs.forEach((d) => {
        if (!d || !d.id || docs.some((x) => x.id === d.id)) return;
        docs.push(d); this.pending.add(d.id);
        if (ok) Local.putDoc(d).catch(() => {});
      });
      if (ok) { try { localStorage.removeItem(LS_DOCS); } catch (e) { /* нет */ } this.savePending(); }
    }
    if (!ok && !lsSet(LS_DOCS + '.probe', 1)) this.broken = true;
    docs.forEach((d) => d && d.id && this.docs.set(d.id, d));
    this.mode = 'local'; this.ready = true;
    await Photos.loadLocal();
    this.status(); this.emit(true);
    window.addEventListener('online', () => { this.offline = false; this.kick(); });
    window.addEventListener('offline', () => { this.offline = true; this.status(); });
    document.addEventListener('visibilitychange', () => { if (!document.hidden) this.kick(); });
    setInterval(() => { if (this.pending.size || this.pendingDel.size || Photos.waiting()) this.kick(); }, 20000);
    this.connectCloud();
  },

  async connectCloud() {
    const c = window.claude;
    if (!c || typeof c.use !== 'function') { this.noCloud = true; this.status(); this.emit(false); return; }
    let db = null, user = null, id = null;
    try { [db, user] = await Promise.all([c.use('db'), c.use('user')]); } catch (e) { /* нет */ }
    try { id = user ? await user.id() : null; } catch (e) { id = null; }
    if (!db || !id) { this.noCloud = true; this.status(); this.emit(false); return; }
    try { this.col = db.collection('data/users/' + id); } catch (e) { this.noCloud = true; this.status(); return; }
    this.mode = 'db';
    await Photos.init();
    this.subscribe();
    this.status();
    this.emit(false);
  },

  subscribe() {
    if (this.unsub) { try { this.unsub(); } catch (e) { /* нет */ } }
    this.cloud = 'connecting'; this.synced = false;
    this.unsub = this.col.onSnapshot((snap) => this.onSnap(snap), (err) => this.onErr(err));
  },

  onSnap(snap) {
    let changed = false;
    snap.docChanges().forEach((ch) => {
      const id = ch.doc.id;
      if (this.pending.has(id) || this.inflight.has(id) || this.pendingDel.has(id)) return;
      if (ch.type === 'removed') {
        if (this.docs.has(id)) { this.docs.delete(id); this.dropLocal(id); changed = true; }
      } else {
        const js = JSON.stringify(ch.doc.data());
        const cur = this.docs.get(id);
        if (!cur || JSON.stringify(cur) !== js) { const d = JSON.parse(js); this.docs.set(id, d); this.keepLocal(d); changed = true; }
      }
    });
    if (!snap.metadata.fromCache && !this.synced) {
      /* первая полная сверка: записи, удалённые на другом устройстве, убираем и с телефона */
      this.synced = true;
      const server = new Set(snap.docs.map((d) => d.id));
      Array.from(this.docs.keys()).forEach((id) => {
        if (!server.has(id) && !this.pending.has(id)) { this.docs.delete(id); this.dropLocal(id); changed = true; }
      });
      this.cloud = 'online';
      this.kick();
    }
    if (changed) this.emit(false);
    this.status();
  },

  onErr() { this.cloud = 'lost'; this.status(); },

  on(fn) { this.listeners.push(fn); },
  emit(first) { this.listeners.forEach((fn) => fn(first)); },
  get(id) { return this.docs.get(id); },
  all(kind) { return Array.from(this.docs.values()).filter((d) => !kind || d.kind === kind); },

  keepLocal(doc) {
    if (Local.ok) Local.putDoc(clone(doc)).catch(() => this.localFail());
    else if (!lsSet(LS_DOCS, { v: 1, docs: Array.from(this.docs.values()) })) this.localFail();
  },
  dropLocal(id) {
    if (Local.ok) Local.delDoc(id).catch(() => {});
    else lsSet(LS_DOCS, { v: 1, docs: Array.from(this.docs.values()) });
  },
  localFail() {
    if (this.warnedLocal) return;
    this.warnedLocal = true; this.broken = true; this.status();
    toast('Телефон не даёт сохранять записи: место закончилось или браузер запрещает хранение.');
  },
  savePending() {
    if (!Local.ok) return;
    Local.setMeta('pending', Array.from(this.pending)).catch(() => {});
    Local.setMeta('pendingDel', Array.from(this.pendingDel)).catch(() => {});
  },

  save(doc) {
    doc.updatedAt = Date.now();
    this.docs.set(doc.id, doc);
    this.keepLocal(doc);
    if (this.mode === 'db') {
      this.pending.add(doc.id); this.savePending();
      clearTimeout(this.timers[doc.id]);
      this.timers[doc.id] = setTimeout(() => this.flushOne(doc.id), 700);
    }
    this.status();
  },

  remove(id) {
    this.docs.delete(id);
    this.pending.delete(id);
    this.dropLocal(id);
    if (this.mode === 'db') { this.pendingDel.add(id); this.savePending(); this.delOne(id); }
    this.status();
  },

  async flushOne(id) {
    if (this.mode !== 'db' || !this.col) return;
    if (this.inflight.has(id)) { this.again.add(id); return; }
    const doc = this.docs.get(id);
    if (!doc) { this.pending.delete(id); this.savePending(); return; }
    const stamp = doc.updatedAt;
    this.inflight.add(id); this.status();
    try {
      await this.col.doc(id).set(clone(doc));
      const cur = this.docs.get(id);
      if (!cur || cur.updatedAt === stamp) { this.pending.delete(id); this.savePending(); }
      this.offline = false;
    } catch (e) { this.cloudFail(e); }
    finally {
      this.inflight.delete(id);
      if (this.again.delete(id)) { clearTimeout(this.timers[id]); this.timers[id] = setTimeout(() => this.flushOne(id), 300); }
      this.status();
    }
  },

  async delOne(id) {
    if (this.mode !== 'db' || !this.col) return;
    try { await this.col.doc(id).delete(); this.pendingDel.delete(id); this.savePending(); this.offline = false; }
    catch (e) { this.cloudFail(e); }
    this.status();
  },

  cloudFail(e) {
    const code = e && e.code;
    if (code === 'quota_exceeded' && !this.warnedQuota) { this.warnedQuota = true; toast('Облако заполнено: удалите старые объекты. На телефоне записи сохранены.'); }
    else if (code === 'invalid_argument' && !this.warnedArg) { this.warnedArg = true; toast('Облако не приняло запись. На телефоне она сохранена.'); }
    else this.offline = true;
  },

  kick() {
    if (this.mode !== 'db' || !this.col) return;
    if (this.cloud === 'lost') this.subscribe();
    this.pending.forEach((id) => { if (!this.inflight.has(id)) this.flushOne(id); });
    this.pendingDel.forEach((id) => this.delOne(id));
    Photos.syncUploads();
  },

  waitingCount() { return this.pending.size + this.pendingDel.size + Photos.waiting(); },

  status() {
    const el = $('#save-state');
    if (!el) return;
    let s = 'ok', t = 'Сохранено';
    const n = this.waitingCount();
    if (this.mode === 'init') { s = 'busy'; t = 'Открываю журнал…'; }
    else if (this.broken) { s = 'err'; t = 'Не сохраняется'; }
    else if (this.mode === 'local') { s = 'local'; t = 'На телефоне'; }
    else if (n && (this.offline || this.cloud === 'lost' || navigator.onLine === false)) { s = 'wait'; t = `Без сети · ждут: ${n}`; }
    else if (n || this.inflight.size) { s = 'busy'; t = 'Отправляю…'; }
    el.dataset.s = s;
    el.querySelector('span').textContent = t;
  },
};

/* ===== скачивание файлов ===== */
let dlPromise = null;
function getDownloads() {
  if (!dlPromise) {
    const c = window.claude;
    dlPromise = c && typeof c.use === 'function' ? c.use('downloads').catch(() => null) : Promise.resolve(null);
  }
  return dlPromise;
}
const MIME = { pdf: 'application/pdf', html: 'text/html', csv: 'text/csv', json: 'application/json', xlsx: 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet' };
function plainDownload(filename, data) {
  const ext = String(filename).split('.').pop();
  const blob = data instanceof Blob ? data : new Blob([data], { type: (MIME[ext] || 'application/octet-stream') + ';charset=utf-8' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a'); a.href = url; a.download = filename;
  document.body.appendChild(a); a.click();
  setTimeout(() => { URL.revokeObjectURL(url); a.remove(); }, 5000);
  toast('Файл сохранён: ' + filename);
}
/* В приложении Android файл отдаётся через мост: сохраняется в «Загрузки» и открывается «Отправить» */
async function toBase64(data) {
  const buf = data instanceof Blob ? new Uint8Array(await data.arrayBuffer()) : new TextEncoder().encode(String(data));
  let s = '';
  for (let i = 0; i < buf.length; i += 0x8000) s += String.fromCharCode.apply(null, buf.subarray(i, i + 0x8000));
  return btoa(s);
}
async function offerFile(filename, data, fallback) {
  if (window.AndroidBridge && typeof window.AndroidBridge.saveFile === 'function') {
    try { const ext = String(filename).split('.').pop(); window.AndroidBridge.saveFile(filename, await toBase64(data), MIME[ext] || 'application/octet-stream'); return; }
    catch (e) { fallback(); return; }
  }
  const c = window.claude;
  if (!c || typeof c.use !== 'function') {
    /* офлайн-файл: на телефоне — «Поделиться» (сохранить в Файлы, отправить), на компьютере — обычное скачивание */
    try {
      const ext = String(filename).split('.').pop();
      const file = new File([data], filename, { type: MIME[ext] || 'application/octet-stream' });
      const touch = window.matchMedia && matchMedia('(pointer: coarse)').matches;
      if (touch && navigator.canShare && navigator.canShare({ files: [file] })) {
        try { await navigator.share({ files: [file], title: filename }); return; } catch (e) { if (e && e.name === 'AbortError') return; }
      }
      plainDownload(filename, data); return;
    } catch (e) { fallback(); return; }
  }
  const dl = await getDownloads();
  if (dl) {
    try {
      const r = await dl.save({ filename, data });
      if (r && r.status === 'saved') toast('Файл сохранён: ' + filename);
      return;
    } catch (e) {
      const code = e && e.code;
      if (code === 'declined') return;
      if (code === 'rate_limited') { toast('Окно сохранения уже открыто.'); return; }
    }
  }
  fallback();
}

/* ===== фото шильдиков: вентилятор, электродвигатель ===== */
const SLOTS = { fan: 'Вентилятор', motor: 'Электродвигатель', note: 'Заметки по системе', scheme: 'Схема' };
/* Фото: {id} — в облаке блокнота; {local} — в памяти телефона, ждёт отправки; {data} — встроено в запись */
const Photos = {
  state: 'local', assets: null, busy: 0, urls: new Map(), syncing: false,
  async init() {
    if (Store.mode !== 'db') { this.state = 'local'; return; }
    const c = window.claude;
    try { this.assets = c && typeof c.use === 'function' ? await c.use('assets') : null; } catch (e) { this.assets = null; }
    this.state = this.assets ? 'assets' : 'none';
  },
  async loadLocal() {
    if (!Local.ok) return;
    try {
      const keys = (await Local.blobKeys()) || [];
      for (const k of keys) { const b = await Local.getBlob(k); if (b) this.urls.set(k, URL.createObjectURL(b)); }
    } catch (e) { /* нет */ }
  },
  canAdd() { return this.state !== 'none'; },
  waiting() { return this.state === 'assets' ? this.urls.size : 0; },
  /* Отправка фото из памяти телефона в облако, когда есть сеть */
  async syncUploads() {
    if (this.state !== 'assets' || this.syncing || !this.urls.size || navigator.onLine === false) return;
    this.syncing = true;
    try {
      for (const sys of Store.all('system')) {
        for (const p of allPhotos(sys)) {
          if (!p || !p.local) continue;
          const blob = await Local.getBlob(p.local);
          if (!blob) { delete p.local; continue; }
          const r = await this.assets.upload(blob, { type: 'image/jpeg' });
          const key = p.local; p.id = r.id; delete p.local;
          Store.save(sys);
          await Local.delBlob(key).catch(() => {});
          const u = this.urls.get(key); if (u) setTimeout(() => URL.revokeObjectURL(u), 60000); this.urls.delete(key);
        }
      }
    } catch (e) { Store.offline = true; }
    finally { this.syncing = false; Store.status(); }
  },
};
function photoSrc(p) {
  if (!p) return '';
  if (p.local && Photos.urls.has(p.local)) return Photos.urls.get(p.local);
  if (p.id) return '/_blob/' + p.id;
  return p.data || '';
}
async function photoBlob(p) {
  if (p.local && Local.ok) { const b = await Local.getBlob(p.local).catch(() => null); if (b) return b; }
  if (p.data) { const r = await fetch(p.data); return r.blob(); }
  if (p.id) { const r = await fetch('/_blob/' + p.id); if (r.ok) return r.blob(); }
  return null;
}
/* Слот фото: 'fan', 'motor' — в системе; 'sec:<id>' — в мерном сечении */
function photoList(sys, slot) {
  if (slot.startsWith('sec:')) { const sec = secOf(sys, slot.slice(4)); if (!sec) return []; sec.photos = sec.photos || []; return sec.photos; }
  sys.photos = sys.photos || {}; sys.photos[slot] = sys.photos[slot] || []; return sys.photos[slot];
}
function peekPhotos(sys, slot) {
  if (slot.startsWith('sec:')) { const sec = secOf(sys, slot.slice(4)); return (sec && sec.photos) || []; }
  return ((sys.photos || {})[slot]) || [];
}
function slotName(sys, slot) {
  if (slot.startsWith('sec:')) { const sec = secOf(sys, slot.slice(4)); return 'Точка № ' + ((sec && sec.no) || '') + (sec && sec.place ? ' · ' + sec.place : ''); }
  return SLOTS[slot] || '';
}

async function shrinkImage(file, max, q) {
  const url = URL.createObjectURL(file);
  try {
    const img = await new Promise((res, rej) => { const i = new Image(); i.onload = () => res(i); i.onerror = rej; i.src = url; });
    const k = Math.min(1, max / Math.max(img.naturalWidth, img.naturalHeight));
    const w = Math.max(1, Math.round(img.naturalWidth * k)), h = Math.max(1, Math.round(img.naturalHeight * k));
    const cv = document.createElement('canvas'); cv.width = w; cv.height = h;
    cv.getContext('2d').drawImage(img, 0, 0, w, h);
    return await new Promise((res) => cv.toBlob(res, 'image/jpeg', q));
  } finally { URL.revokeObjectURL(url); }
}
function blobToDataURL(b) { return new Promise((res, rej) => { const r = new FileReader(); r.onload = () => res(r.result); r.onerror = rej; r.readAsDataURL(b); }); }

let lastPhotoT = 0;
function photoStamp() { const t = Math.max(Date.now(), lastPhotoT + 1); lastPhotoT = t; return t; }
async function addPhotos(sys, slot, files) {
  if (Photos.state === 'pending') await Photos.init();
  if (!Photos.canAdd()) { toast('Фото может добавлять только владелец блокнота.'); return; }
  const list = photoList(sys, slot);
  const scheme = slot === 'scheme';
  Photos.busy++; toast(scheme ? 'Сохраняю схему…' : 'Сохраняю фото…');
  let added = 0;
  const items = [];
  for (const f of files) {
    const isPdf = /pdf/i.test(f.type || '') || /\.pdf$/i.test(f.name || '');
    try {
      if (isPdf) {
        if (!scheme) { toast('PDF можно загрузить только как схему.'); continue; }
        toast('Открываю PDF…');
        const { blobs, total } = await pdfToImages(f, 2800, 0.85, 12);
        blobs.forEach((b, i) => items.push({ blob: b, name: (f.name || 'схема.pdf') + (total > 1 ? ', стр. ' + (i + 1) : '') }));
        if (total > blobs.length) toast(`Из PDF взяты первые ${blobs.length} стр. из ${total}.`);
      } else {
        items.push({ blob: await shrinkImage(f, scheme ? 2800 : 1600, scheme ? 0.85 : 0.82), name: scheme ? (f.name || '') : '' });
      }
    } catch (e) {
      try { console.warn('scheme file', e); } catch (err) { /* нет */ }
      toast(isPdf ? 'Не удалось открыть PDF. Сохраните схему как JPEG и загрузите снова.' : 'Не удалось прочитать фото.');
    }
  }
  for (const it of items) {
    try {
      const blob = it.blob;
      let entry = null;
      if (Photos.state === 'assets' && navigator.onLine !== false) {
        try { const r = await Photos.assets.upload(blob, { type: 'image/jpeg' }); entry = { id: r.id, t: photoStamp() }; }
        catch (e) { if (e && (e.code === 'quota_or_state' || e.code === 'too_large' || e.code === 'unsupported_type')) throw e; }
      }
      if (!entry && Local.ok) {
        /* нет сети — фото ждёт в памяти телефона и уйдёт в облако позже */
        const key = newId('b');
        await Local.putBlob(key, blob);
        Photos.urls.set(key, URL.createObjectURL(blob));
        entry = { local: key, t: photoStamp() };
      }
      if (!entry) entry = { data: await blobToDataURL(await shrinkImage(blob, scheme ? 1800 : 1280, 0.7)), t: photoStamp() };
      if (it.name) entry.name = it.name;
      list.push(entry);
      added++;
      Store.save(sys);
    } catch (e) {
      const code = e && e.code;
      toast(code === 'quota_or_state' ? 'Место под фото закончилось — удалите лишние.' : code === 'too_large' ? 'Фото слишком большое.' : 'Не удалось сохранить фото. Попробуйте ещё раз.');
    }
  }
  Photos.busy--;
  if (added) toast(scheme ? (added === 1 ? 'Схема добавлена.' : `Добавлено листов схемы: ${added}.`) : added === 1 ? 'Фото добавлено.' : `Добавлено фото: ${added}.`);
  if ((UI.route.name === 'system' || UI.route.name === 'section') && UI.route.sid === sys.id) { const y = window.scrollY; render(); window.scrollTo(0, y); }
}

function photoGrid(sys, slot, what = 'шильдик') {
  const list = peekPhotos(sys, slot);
  const scheme = slot === 'scheme';

/* ===== Схема системы с точками замера: JPEG/PNG или PDF (листы PDF превращаются в картинки) ===== */
let pdfjsP = null;
function loadPdfJs() {
  if (!pdfjsP) {
    pdfjsP = (async () => {
      const base = new URL('pdfjs/', document.baseURI).href;
      const lib = await import(base + 'pdf.min.js');
      lib.GlobalWorkerOptions.workerSrc = base + 'pdf.worker.min.js';
      return { lib, base };
    })();
    pdfjsP.catch(() => { pdfjsP = null; });
  }
  return pdfjsP;
}
async function pdfToImages(file, maxSide, q, maxPages) {
  const { lib, base } = await loadPdfJs();
  const data = new Uint8Array(await file.arrayBuffer());
  const task = lib.getDocument({ data, standardFontDataUrl: base + 'standard_fonts/', wasmUrl: base + 'wasm/', isEvalSupported: false });
  const doc = await task.promise;
  const total = doc.numPages, blobs = [];
  try {
    for (let n = 1; n <= Math.min(total, maxPages); n++) {
      const page = await doc.getPage(n);
      const v1 = page.getViewport({ scale: 1 });
      const vp = page.getViewport({ scale: Math.min(6, maxSide / Math.max(v1.width, v1.height)) });
      const cv = document.createElement('canvas');
      cv.width = Math.max(1, Math.floor(vp.width)); cv.height = Math.max(1, Math.floor(vp.height));
      const ctx = cv.getContext('2d');
      ctx.fillStyle = '#fff'; ctx.fillRect(0, 0, cv.width, cv.height);
      await page.render({ canvasContext: ctx, canvas: cv, viewport: vp }).promise;
      const b = await new Promise((res) => cv.toBlob(res, 'image/jpeg', q));
      if (b) blobs.push(b);
      page.cleanup(); cv.width = 1; cv.height = 1;
    }
  } finally { try { task.destroy(); } catch (e) { /* нет */ } }
  if (!blobs.length) throw new Error('pdf');
  return { blobs, total };
}

/* Просмотр с увеличением: два пальца — масштаб, один — сдвиг, двойное касание — ×2,5 / вписать */
function zoomInit() {
  const st = $('#zv-stage'), img = $('#zv-img');
  if (!st || !img) return;
  const z = { s: 1, x: 0, y: 0, fit: 1 };
  const apply = () => { img.style.transform = `translate(${z.x}px,${z.y}px) scale(${z.s})`; };
  const fit = () => {
    const W = st.clientWidth, H = st.clientHeight, w = img.naturalWidth || 1, h = img.naturalHeight || 1;
    z.fit = Math.min(W / w, H / h); z.s = z.fit; z.x = (W - w * z.s) / 2; z.y = (H - h * z.s) / 2; apply();
  };
  const zoomAt = (k, cx, cy) => {
    const ns = Math.min(Math.max(z.fit * 14, 3), Math.max(z.fit * 0.7, z.s * k)), r = ns / z.s;
    z.x = cx - (cx - z.x) * r; z.y = cy - (cy - z.y) * r; z.s = ns; apply();
  };
  if (img.complete && img.naturalWidth) fit(); else img.addEventListener('load', fit, { once: true });
  const pts = new Map();
  let pinch = null, tap = null, lastTap = 0;
  const local = (e) => { const r = st.getBoundingClientRect(); return [e.clientX - r.left, e.clientY - r.top]; };
  st.addEventListener('pointerdown', (e) => {
    try { st.setPointerCapture(e.pointerId); } catch (err) { /* нет */ }
    pts.set(e.pointerId, { x: e.clientX, y: e.clientY });
    pinch = null;
    tap = pts.size === 1 ? { x: e.clientX, y: e.clientY, moved: false } : null;
  });
  st.addEventListener('pointermove', (e) => {
    const prev = pts.get(e.pointerId);
    if (!prev) return;
    pts.set(e.pointerId, { x: e.clientX, y: e.clientY });
    if (tap && Math.hypot(e.clientX - tap.x, e.clientY - tap.y) > 8) tap.moved = true;
    if (pts.size === 1) { z.x += e.clientX - prev.x; z.y += e.clientY - prev.y; apply(); return; }
    const [a, b] = [...pts.values()];
    const r = st.getBoundingClientRect();
    const d = Math.hypot(a.x - b.x, a.y - b.y), cx = (a.x + b.x) / 2 - r.left, cy = (a.y + b.y) / 2 - r.top;
    if (pinch && pinch.d > 0) { zoomAt(d / pinch.d, cx, cy); z.x += cx - pinch.cx; z.y += cy - pinch.cy; apply(); }
    pinch = { d, cx, cy };
  });
  const up = (e) => {
    pts.delete(e.pointerId); pinch = null;
    if (e.type === 'pointerup' && tap && !tap.moved && !pts.size) {
      const t = Date.now();
      if (t - lastTap < 320) { const [cx, cy] = local(e); if (z.s > z.fit * 1.4) fit(); else zoomAt(2.5, cx, cy); lastTap = 0; } else lastTap = t;
    }
    if (!pts.size) tap = null;
  };
  st.addEventListener('pointerup', up);
  st.addEventListener('pointercancel', up);
  st.addEventListener('wheel', (e) => { e.preventDefault(); const [cx, cy] = local(e); zoomAt(e.deltaY < 0 ? 1.25 : 0.8, cx, cy); }, { passive: false });
  st._zv = { fit, zoom: (k) => zoomAt(k, st.clientWidth / 2, st.clientHeight / 2) };
}

/* ===== журнал: объекты → системы → мерные сечения ===== */
const SYS_TYPES = [
  ['supply', 'Приточная'], ['exhaust', 'Вытяжная'], ['supex', 'Приточно-вытяжная'], ['ac', 'Кондиционирования'],
  ['local', 'Местные отсосы'], ['heat', 'Воздушное отопление'], ['smoke_in', 'Противодымная: подпор'],
  ['smoke_out', 'Противодымная: дымоудаление'], ['smoke_comp', 'Противодымная: компенсация дымоудаления'], ['natural', 'Естественная'],
];
const sysTypeName = (k) => (SYS_TYPES.find((x) => x[0] === k) || [0, ''])[1];

function baOf(sys) { const b = N(sys && sys.Ba); return OK(b) && b > 50 ? b : 101.3; }
function objOf(id) { const d = Store.get(id); return d && d.kind === 'object' ? d : null; }
function sysOf(id) { const d = Store.get(id); return d && d.kind === 'system' ? d : null; }
function systemsOf(oid) { return Store.all('system').filter((s) => s.objectId === oid).sort((a, b) => natCmp(a.name, b.name)); }
function secOf(sys, cid) { return (sys.sections || []).find((s) => s.id === cid); }
/* Расход вентилятора (ГОСТ 34060, п. 11.2.2): по сечениям «Вентилятор — всасывание» и «— нагнетание».
   Замерены оба — среднее арифметическое; один — его значение. Нет таких сечений — из табл. А.1.1. */
function fanFlow(sys, res) {
  res = res || M.system(sys);
  const fan = (sys.pass && sys.pass.fan) || {};
  const fs = res.secs.filter(({ s }) => s.role === 'fan_in' || s.role === 'fan_out');
  const passP = N((fan.proj || {}).L), passF = N((fan.fact || {}).L);
  let proj, fact, src = '';
  const auto = fs.length > 0;
  if (auto) {
    const meas = fs.filter(({ r }) => OK(r.L));
    fact = meas.length ? M.mean(meas.map(({ r }) => r.L)) : NaN;
    const lps = fs.map(({ r }) => r.Lp).filter(OK);
    proj = lps.length ? M.mean(lps) : passP;
    const name = (x) => (x.s.role === 'fan_in' ? 'всас.' : 'нагн.') + ' № ' + (x.s.no || '');
    src = meas.length > 1 ? 'среднее ' + meas.map(name).join(' и ') : (meas.length ? name(meas[0]) : fs.map(name).join(', '));
  } else { proj = passP; fact = passF; }
  const dev = OK(proj) && proj > 0 && OK(fact) ? (fact - proj) / proj * 100 : NaN;
  return { proj, fact, dev, auto, src };
}

/* --- поля ввода --- */
function fid(doc, path) { return 'f_' + doc.id + '_' + path.replace(/[^\w]/g, '_'); }
function getPath(doc, path) {
  let o = doc, parts;
  if (path.startsWith('sec:')) { const [sid, ...rest] = path.slice(4).split('.'); o = secOf(doc, sid); parts = rest; } else parts = path.split('.');
  for (const k of parts) { if (o == null) return ''; o = o[k]; }
  return o ?? '';
}
function setPath(doc, path, value) {
  let o = doc, parts;
  if (path.startsWith('sec:')) { const [sid, ...rest] = path.slice(4).split('.'); o = secOf(doc, sid); parts = rest; if (!o) return; } else parts = path.split('.');
  for (let i = 0; i < parts.length - 1; i++) {
    const k = parts[i], nextIdx = /^\d+$/.test(parts[i + 1]);
    if (o[k] == null || typeof o[k] !== 'object') o[k] = nextIdx ? [] : {};
    o = o[k];
  }
  o[parts[parts.length - 1]] = value;
}
/* Время изменения: точка — целиком (sec.u), поля системы и объекта — по отдельности (ft) */
function touch(doc, path) {
  const now = Date.now();
  if (doc.kind === 'system' && path.startsWith('sec:')) { const c = secOf(doc, path.slice(4).split('.')[0]); if (c) c.u = now; return; }
  (doc.ft || (doc.ft = {}))[path] = now;
}

function delBtn(key, text = 'Удалить') {

/* ===== Модули: сворачиваются по нажатию на заголовок, «булавка» — держать открытым ===== */
const LS_MODS = 'vnb.mods.v1';
const MOD_PIN_DEFAULT = { 'sys.head': true, 'sys.points': true, 'pt.point': true, 'pt.meas': true, 'calc.sect': true };
const modPins = Object.assign({}, MOD_PIN_DEFAULT, lsGet(LS_MODS) || {});
UI.modOpen = {};
function modPinned(k) { return !!modPins[k]; }
function modIsOpen(k) { return Object.prototype.hasOwnProperty.call(UI.modOpen, k) ? UI.modOpen[k] : modPinned(k); }
function modToggle(k) { UI.modOpen[k] = !modIsOpen(k); }
function modPin(k) { const was = modIsOpen(k); modPins[k] = !modPinned(k); UI.modOpen[k] = modPins[k] ? true : was; lsSet(LS_MODS, modPins); }
const PIN_SVG = '<svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path fill="currentColor" d="M16 9V4h1c.55 0 1-.45 1-1s-.45-1-1-1H7c-.55 0-1 .45-1 1s.45 1 1 1h1v5c0 1.66-1.34 3-3 3v2h5.97v7l1 1 1-1v-7H19v-2c-1.66 0-3-1.34-3-3z"/></svg>';
/* sum — короткая сводка в свёрнутом заголовке (уже экранирована) */
function modCard(k, cls, title, sum, body, actions = '') {
  const open = modIsOpen(k), pin = modPinned(k);
  return `<section class="card ${cls} mod${open ? '' : ' closed'}" data-mod="${k}">
    <div class="mod-h"><h2 class="mod-h2"><button class="mod-t" data-act="mod-toggle" data-mod="${k}" aria-expanded="${open}"><span class="chev" aria-hidden="true"></span><span class="mod-tt">${title}</span>${!open && sum ? `<span class="mod-sum">${sum}</span>` : ''}</button></h2>
      ${actions}<button class="mod-pin" data-act="mod-pin" data-mod="${k}" aria-pressed="${pin}" aria-label="${pin ? 'Открепить' : 'Закрепить открытым'}: ${title}" title="${pin ? 'Закреплено — всегда открыто' : 'Закрепить открытым'}">${PIN_SVG}</button></div>

const photoCount = (n) => (n ? `${n} фото` : '');

function pill(status, text) { return `<span class="pill ${status === 'none' ? '' : status}">${esc(text)}</span>`; }
function tolText(tol) { return tol[0] === -tol[1] ? `±${tol[1]} %` : `${tol[0] === 0 ? '0' : tol[0]}…+${tol[1]} %`; }

/* ===== список объектов ===== */
function viewObjects() {
  const objs = Store.all('object').sort((a, b) => (b.updatedAt || 0) - (a.updatedAt || 0));
  const localNote = Store.mode === 'local' && Store.noCloud
    ? (window.AndroidBridge
      ? `<div class="banner">Записи и фото хранятся в телефоне, интернет не нужен. Время от времени делайте «Сохранить копию» внизу — при удалении приложения записи пропадут.</div>`
      : `<div class="banner warn">Офлайн-режим: записи хранятся только на этом устройстве. Чтобы перенести их в облачный блокнот или на другой телефон — «Сохранить копию» внизу, затем «Загрузить из файла» там.</div>`) : '';
  if (!Store.ready) {
    return `<div class="stack"><div class="empty"><h2>Открываю журнал…</h2><p class="lead">Здесь появятся ваши объекты: системы, мерные сечения и замеры по ГОСТ 12.3.018 с проверкой допусков ГОСТ 34060.</p></div></div>`;
  }
  if (!objs.length) {
    return `<div class="stack">${localNote}
      <div class="empty">
        <span class="ref">Журнал пуст</span>
        <h2>Заведите первый объект</h2>
        <p class="lead">Объект → системы (П1, В1…) → точки замера. Блокнот расставит точки замера, посчитает расход, сравнит с проектом по допускам ГОСТ 34060 и соберёт паспорт системы.</p>
        <div class="head-actions">

  const cards = objs.map((o) => {

    return `<button class="ocard st-${badN ? 'bad' : (okN ? 'ok' : 'none')}" data-act="go" data-go='${esc(JSON.stringify({ name: 'object', oid: o.id }))}'>

      <h3>${esc(o.name || 'Без названия')}</h3>
      <div class="meta">${esc(o.address || 'Адрес не указан')}</div>
      <div class="row">

        <span class="pill">${secN} ${plural(secN, 'точка', 'точки', 'точек')}</span>
        ${badN ? pill('bad', badN + ' вне допуска') : (okN ? pill('ok', 'все в допуске') : '')}
      </div>
    </button>`;
  }).join('');
  return `<div class="stack">
    <div class="head"><div><h1>Объекты</h1></div>
      <div class="head-actions"><button class="btn primary" data-act="add-object">+ Новый объект</button></div></div>
    ${localNote}
    <div class="cards">${cards}</div>
    ${backupBlock()}
  </div>`;
}
function plural(n, one, few, many) { const m10 = n % 10, m100 = n % 100; if (m10 === 1 && m100 !== 11) return one; if (m10 >= 2 && m10 <= 4 && (m100 < 10 || m100 >= 20)) return few; return many; }
function backupBlock() {

    <div class="head-actions"><button class="btn" data-act="backup">Сохранить копию</button><button class="btn" data-act="import">Загрузить из файла</button></div></section>`;
}

/* ===== объект ===== */
function viewObject(o) {

  const rows = syss.map((s, i) => {
    const fan = (s.pass && s.pass.fan) || {};
    const ff = fanFlow(s);
    const Lp = ff.proj, Lf = ff.fact, dev = ff.dev;
    const hz = (fan.fact || {}).vfd || '';
    const devCell = OK(dev) ? `<span class="dv ${Math.abs(dev) <= 5 ? 'ok' : 'bad'}">${M.fmtSigned(dev, 1)}</span>` : '—';
    return `<tr class="click st-${OK(dev) ? (Math.abs(dev) <= 5 ? 'ok' : 'bad') : 'none'}" data-act="go" data-go='${esc(JSON.stringify({ name: 'system', sid: s.id }))}'>

      <div class="card-head"><h2>Системы</h2><button class="btn primary" data-act="add-system">+ Система</button></div>
      ${syss.length ? `<div class="tbl-wrap"><table class="systbl"><thead>

          <tr><th class="r">проект</th><th class="r">факт</th></tr></thead><tbody>${rows}</tbody></table></div>
        <p class="hint" style="margin-top:8px">Расход вентилятора — среднее по точкам «Вент. всас» и «Вент. нагнет» (или одна из них). Допуск ±5 %.</p>`

      <div class="head-actions"><button class="btn primary" data-act="export-pdf">PDF</button><button class="btn" data-act="export-xlsx">Таблица Excel</button></div></section>
    <section class="card c-point"><div class="card-head"><h2>Обмен с напарником</h2></div>
      <p class="muted small" style="margin-bottom:10px">Файл только этого объекта: системы, точки, фото, схема. Напарник загружает его кнопкой «Загрузить файл» — данные сливаются: по каждой точке остаётся более свежая запись, удалённое удаляется и у него.</p>

    <div class="head-actions">${delBtn('obj:' + o.id, 'Удалить объект')}</div>

/* ===== система ===== */

  const o = objOf(sys.objectId);
  const res = M.system(sys);
  const rows = res.secs.map(({ s, r }) => {
    const size = s.method === 'hood' ? 'воронка' : s.method === 'kfactor' ? (s.kFan ? `K ${s.kFan}` : 'K-фактор') : (s.shape === 'round' ? (s.D ? `Ø${s.D}` : '—') : (s.a && s.b ? `${s.a}×${s.b}` : '—'));
    return `<tr class="click st-${r.status}" data-act="go" data-go='${esc(JSON.stringify({ name: 'section', sid: sys.id, cid: s.id }))}'>
      <td class="num"><b>${esc(s.no || '—')}</b></td><td>${esc([(s.role || 'terminal') === 'terminal' ? s.room : '', s.place].filter((x) => String(x || '').trim()).join(' · '))}</td><td class="hm">${esc((M.ROLES[s.role] || M.ROLES.terminal).short)}</td>
      <td class="num sz">${esc(size)}${M.usesK(s) && OK(N(s.kFree)) && N(s.kFree) !== 1 ? ` <span class="ref kt">K ${esc(s.kFree)}</span>` : ''}</td><td class="r num">${F(r.Lp)}</td><td class="r num">${F(r.L)}</td>
      <td class="r num"><span class="dv ${r.status}">${OK(r.dev) ? M.fmtSigned(r.dev, 1) : '—'}</span></td><td class="hm">${pill(r.status, r.status === 'ok' ? 'в допуске' : r.status === 'bad' ? 'вне допуска' : (OK(r.L) ? 'нет проекта' : 'нет замеров'))}</td></tr>`;
  }).join('');
  const stamp = `<div class="stamp">
      ${stampCell(sys, 'name', 'Система, установка', 'title s2')}
      ${stampCell(sys, 'location', 'Местонахождение оборудования', 's4')}
      <div class="c s3 half"><label for="${fid(sys, 'type')}">Тип</label><select id="${fid(sys, 'type')}" data-doc="${sys.id}" data-path="type">${SYS_TYPES.map(([v, t]) => `<option value="${v}"${sys.type === v ? ' selected' : ''}>${t}</option>`).join('')}</select></div>
      ${stampCell(sys, 'date', 'Дата испытаний', 's3 half', { type: 'date' })}
    </div>`;
  const headSum = esc([sys.name, sysTypeName(sys.type), sys.location].filter(Boolean).join(' · '));
  const table = res.count ? `<div class="tbl-wrap"><table class="sectbl"><thead><tr><th>№</th><th>Помещение, место</th><th class="hm">Тип</th><th class="sz">Размер, мм</th><th class="r">L проект</th><th class="r">L факт</th><th class="r">Δ, %</th><th class="hm">Статус</th></tr></thead><tbody>${rows}</tbody></table></div>`
    : `<p class="muted">Добавьте первую точку замера: у вентилятора, на магистрали или у воздухораспределителя.</p>`;
  const ptsSum = res.count ? `${res.count} ${plural(res.count, 'точка', 'точки', 'точек')}${res.badN ? ` · <span class="bad-t">${res.badN} вне допуска</span>` : ''}` : 'нет точек';
  return `<div class="stack">
    ${crumbs([{ t: 'Объекты', go: { name: 'objects' } }, { t: (o && o.name) || 'Объект', go: { name: 'object', oid: sys.objectId } }, { t: sys.name || 'Система' }])}
    ${modCard('sys.head', 'c-note', 'Система', headSum, stamp)}

    ${roomsCard(res)}
    ${schemeCard(sys)}
    ${equipCards(sys, res)}
    <div class="head-actions">${delBtn('sys:' + sys.id, 'Удалить систему')}</div>
  </div>`;
}

/* Помещения с несколькими решётками: сумма ±10 % → каждая ±20 % (ГОСТ 34060-2026, п. 8.2.5) */
function roomsCard(res) {
  if (!res.rooms || !res.rooms.length) return '';
  const st = (R) => (R.status === 'ok' ? 'в допуске' : R.status === 'bad' ? 'вне допуска' : `измерено ${R.m} из ${R.n}`);
  const rows = res.rooms.map((R) => `<tr class="st-${R.status}"><td>${esc(R.name)}</td><td class="num">${R.n}</td><td class="r num">${F(R.Lp)}</td><td class="r num">${R.complete ? F(R.L) : '—'}</td><td class="r num"><span class="dv ${R.status}">${OK(R.dev) ? M.fmtSigned(R.dev, 1) : '—'}</span></td><td class="hm">${pill(R.status, st(R))}</td></tr>`).join('');
  const bad = res.rooms.filter((R) => R.status === 'bad').length, wait = res.rooms.filter((R) => R.status === 'none').length;
  const sum = `${res.rooms.length} ${plural(res.rooms.length, 'помещение', 'помещения', 'помещений')}${bad ? ` · <span class="bad-t">${bad} вне допуска</span>` : wait ? ' · не все замеры' : ' · <span class="ok-t">в допуске</span>'}`;
  return modCard('sys.rooms', 'c-list', 'Помещения', sum, `<div class="tbl-wrap"><table class="sectbl"><thead><tr><th>Помещение</th><th>Решёток</th><th class="r">Σ проект</th><th class="r">Σ факт</th><th class="r">Δ, %</th><th class="hm">Оценка</th></tr></thead><tbody>${rows}</tbody></table></div>
    <p class="hint" style="margin-top:8px">Решётки одного помещения одной системы: каждая ±20 %, если сумма по помещению отличается от проекта не более чем на ±10 %; иначе каждая ±10 % (ГОСТ 34060-2026, п. 8.2.5). Помещение задаётся в точке, поле «Помещение».</p>`);
}

/* ===== мерное сечение ===== */

function geoHTML(r, sec) {
  if (sec.method === 'hood' || !sec.method) return '';
  return `<p class="hint">Площадь сечения F = ${OK(r.F) ? F(r.F, 4) + ' м²' : '—'}</p>`;
}

/* Итог точки: отклонение крупно, под ним — как получился L факт */
function resultHTML(r, sec) {
  const stTxt = r.status === 'ok' ? 'в допуске' : r.status === 'bad' ? 'вне допуска' : (OK(r.L) ? 'нет L проект' : 'нет замера');
  const lines = [];
  if (r.kfMode && OK(r.L)) lines.push(`L факт = <b>${F(r.L)}</b> м³/ч <span class="muted">(K ${F(r.kFan, Number.isInteger(r.kFan) ? 0 : 2)} × √${F(r.dpK, Number.isInteger(r.dpK) ? 0 : 1)} Па)</span>`);
  else if (!r.byL && OK(r.L)) {
    const how = [OK(r.v) ? `V ${F(r.v, 2)} м/с` : '', OK(r.F) ? `F ${F(r.F, 4)} м²` : '', r.kOn && r.k !== 1 ? `K ${F(r.k, 2)}` : ''].filter(Boolean).join(' × ');
    lines.push(`L факт = <b>${F(r.L)}</b> м³/ч${how ? ` <span class="muted">(${how})</span>` : ''}`);
  }
  if (OK(r.ptot)) lines.push(`Pп ${F(r.ptot, 0)} Па`);
  const msg = r.warn[0] || r.info[0] || (r.status === 'bad' ? 'Отрегулируйте и повторите замер' : '');
  let roomLine = '';
  if (r.room) {
    const R = r.room, nm = `Помещение «${esc(R.name)}», ${R.n} ${plural(R.n, 'решётка', 'решётки', 'решёток')}`;
    const t = !R.complete ? `${nm}: измерено ${R.m}. Пока допуск ±10 %; когда будут все — проверится сумма.`
      : R.ok ? `${nm}: Σ ${F(R.L)} / ${F(R.Lp)} м³/ч (${M.fmtSigned(R.dev, 1)} %) — сумма в пределах ±10 %, поэтому для каждой допуск ±20 %.`
        : `${nm}: Σ ${F(R.L)} / ${F(R.Lp)} м³/ч (${M.fmtSigned(R.dev, 1)} %) — сумма больше ±10 %, для каждой допуск ±10 %.`;
    roomLine = `<div class="res2-room st-${R.status}">${t}</div>`;
  }
  return `<div class="res2 st-${r.status}" role="status">
      <div class="res2-top"><span class="res2-dev">${OK(r.dev) ? M.fmtSigned(r.dev, 1) + ' %' : '—'}</span><span class="res2-st">${stTxt}<small>допуск ${tolText(r.tol)}</small></span></div>
      ${lines.length ? `<div class="res2-sub">${lines.join(' · ')}</div>` : ''}${msg ? `<div class="res2-msg">${esc(msg)}</div>` : ''}${roomLine}
    </div>`;
}

function oneVal(x) { return Array.isArray(x) ? (x[0] ?? '') : (x ?? ''); }
