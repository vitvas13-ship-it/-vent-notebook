      { k: 'drill', l: 'Отверстия', t: 'sel', o: [['v', 'Сверху'], ['h', 'Сбоку']], d: 'v' },
      { k: 'D', l: 'Диаметр D', u: 'мм', d: '400', show: isRound },
      { k: 'a', l: 'Ширина a', u: 'мм', d: '500', show: (v) => !isRound(v) },
      { k: 'b', l: 'Высота b', u: 'мм', d: '300', show: (v) => !isRound(v) },
    ],
    formula: 'Dh = 4F / П;  сечение ≥ 6Dh после возмущения и ≥ 2Dh до него;  отклонение координат ≤ ±10 %',
    calc(v) {
      const D = N(v.D), a = N(v.a), b = N(v.b);
      const g = M.geom(v.shape, D, a, b), P = M.points(v.shape, D, a, b);
      if (!OK(g.F)) return '<p class="muted">Введите размеры.</p>';
      const vert = v.drill !== 'h';
      const round = v.shape === 'round';
      const w = round ? D : a;
      const items = [kvI('Площадь F', F(g.F, 4), 'м²'), kvI('Прямой участок до / после', `${F(6 * g.Dh / 1000, 2)} / ${F(2 * g.Dh / 1000, 2)}`, 'м'),
        kvI('Зонд, Ø не более', F(0.08 * w, 0), 'мм'), kvI('Точек замера', P.z, '', true)];
      /* Таблица: блок «отверстие» (номер, где сверлить) отдельно от блока «глубины ввода» */
      const dcells = (arr) => arr.map((x, i) => `<td class="r num dp${i === 0 ? ' first' : ''}">${F(x, 0)}</td>`).join('');
      let rows, head, nd;
      if (round) {
        const depths = [...new Set(P.pts.filter((p) => p.axis !== 'Г' || P.pts.length === 1).map((p) => p.depth))].sort((x, y) => x - y);
        nd = depths.length;
        head = `<tr><th class="gh" colspan="2">Отверстие</th><th class="gd first" colspan="${nd}">Глубина ввода зонда, мм</th></tr>
          <tr><th class="gh">№</th><th class="gh">Где</th>${depths.map((_, i) => `<th class="gd r${i === 0 ? ' first' : ''}">${i + 1}</th>`).join('')}</tr>`;
        rows = `<tr><td class="hl1"><b>1</b></td><td class="hl1">${vert ? 'сверху' : 'сбоку'}</td>${dcells(depths)}</tr>` +
          (P.pts.length > 1 ? `<tr><td class="hl1"><b>2</b></td><td class="hl1">${vert ? 'сбоку' : 'сверху'}, 90°</td>${dcells(depths)}</tr>` : '');
      } else {
        const xs = [...new Set(P.pts.map((p) => p.x))], ys = [...new Set(P.pts.map((p) => p.y))];
        const holes = vert ? xs.map((x) => x * a) : ys.map((y) => y * b);
        const depths = vert ? ys.map((y) => y * b) : xs.map((x) => x * a);
        nd = depths.length;
        head = `<tr><th class="gh" colspan="2">Отверстие</th><th class="gd first" colspan="${nd}">Глубина ввода зонда, мм</th></tr>
          <tr><th class="gh">№</th><th class="gh r">${vert ? 'От левого края' : 'От верха'}, мм</th>${depths.map((_, i) => `<th class="gd r${i === 0 ? ' first' : ''}">${i + 1}</th>`).join('')}</tr>`;
        rows = holes.map((hx, i) => `<tr><td class="hl1"><b>${i + 1}</b></td><td class="r num hl1">${F(hx, 0)}</td>${dcells(depths)}</tr>`).join('');
      }
      const where = round ? (vert ? 'Отверстие 1 — в верхней стенке, зонд вертикально.' : 'Отверстие 1 — в боковой стенке, зонд горизонтально.') + ' По ГОСТ нужны два взаимно перпендикулярных диаметра.'
        : (vert ? `Отверстия в верхней (или нижней) стенке, ${P.z / Math.max(1, [...new Set(P.pts.map((p) => p.x))].length)} глубины в каждом.` : `Отверстия в боковой стенке, ${P.z / Math.max(1, [...new Set(P.pts.map((p) => p.y))].length)} глубины в каждом.`);
      return kvBox(items) + `<p class="small muted">${esc(P.rule)}${P.note ? ' ' + esc(P.note) : ''}</p>` +
        `<div class="diagram"><div class="dsvg">${drillSVG(v.shape, a, b, P, v.drill)}</div><div class="dtable"><div class="tbl-wrap"><table class="drilltbl"><thead>${head}</thead><tbody>${rows}</tbody></table></div>
        <p class="hint" style="margin-top:8px">${esc(where)} Глубина — от внутренней поверхности стенки; прибавьте толщину стенки и изоляции.</p></div></div>`;
    },
  },
  {
    id: 'flow', title: 'Скорость и расход', sum: 'L = 3600 · V · F', ref: 'впишите скорость — посчитается расход, впишите расход — скорость',
    fields: [
      { k: 'shape', l: 'Форма', t: 'sel', o: SHAPES, d: 'round', w: 'span2' },
      { k: 'D', l: 'Диаметр D', u: 'мм', d: '', show: isRound },
      { k: 'a', l: 'Ширина a', u: 'мм', d: '', show: (v) => !isRound(v) },
      { k: 'b', l: 'Высота b', u: 'мм', d: '', show: (v) => !isRound(v) },
      { k: 'V', l: 'Скорость V', u: 'м/с', d: '', w: 'vl' },
      { k: 'L', l: 'Расход L', u: 'м³/ч', d: '', w: 'vl' },
    ],
    /* какое из двух полей считается само: то, которое не вписывали последним */
    auto: (st) => (st.last === 'L' ? 'V' : 'L'),
    sync(v, k, st) {
      if (k === 'V' || k === 'L') st.last = k;
      const g = M.geom(v.shape, N(v.D), N(v.a), N(v.b));
      if (!OK(g.F)) return {};
      const num = (x, d) => (OK(x) ? (Math.round(x * 10 ** d) / 10 ** d).toFixed(d).replace('.', ',') : '');
      if (st.last === 'L') { const L = N(v.L); return { V: OK(L) ? num(L / 3600 / g.F, 2) : '' }; }
      const V = N(v.V); return { L: OK(V) ? num(3600 * V * g.F, 0) : '' };
    },
    formula: 'L = 3600 · V · F;  F = π·D²/4 или a·b;  Pд = ρ·V²/2 (ρ = 1,2 кг/м³)',
    calc(v) {
      const g = M.geom(v.shape, N(v.D), N(v.a), N(v.b));
      if (!OK(g.F)) return '<p class="muted">Введите размеры.</p>';
      const V = N(v.V), L = N(v.L);
      const items = [kvI('Площадь F', F(g.F, 4), 'м²')];
      if (OK(L)) items.push(kvI('Расход', `${F(L / 3600, 4)} м³/с · ${F(L / 3.6, 1)}`, 'л/с'));
      if (OK(V)) items.push(kvI('Динамическое давление', F(1.2 * V * V / 2, 1), 'Па'));
      return kvBox(items);
    },
  },
  {
    id: 'ach', title: 'Кратность воздухообмена', sum: 'n = L / Vпом', ref: 'впишите расход — посчитается кратность, впишите кратность — расход',
    fields: [
      { k: 'S', l: 'Площадь S', u: 'м²', d: '' },
      { k: 'h', l: 'Высота h', u: 'м', d: '' },
      { k: 'Vr', l: 'или объём V', u: 'м³', d: '', h: 'если вписан — S и h не нужны', w: 'span2' },
      { k: 'L', l: 'Расход L', u: 'м³/ч', d: '', w: 'vl' },
      { k: 'n', l: 'Кратность n', u: '1/ч', d: '', w: 'vl' },
    ],
    auto: (st) => (st.last === 'n' ? 'L' : 'n'),
    sync(v, k, st) {
      if (k === 'L' || k === 'n') st.last = k;
      const Vr = achVolume(v);
      if (!OK(Vr)) return {};
      const num = (x, d) => (OK(x) ? (Math.round(x * 10 ** d) / 10 ** d).toFixed(d).replace('.', ',') : '');
      if (st.last === 'n') { const n = N(v.n); return { L: OK(n) ? num(n * Vr, 0) : '' }; }
      const L = N(v.L); return { n: OK(L) ? num(L / Vr, 2) : '' };
    },
    formula: 'n = L / V;  L = n · V;  V = S · h',
    calc(v) {
      const Vr = achVolume(v), S = N(v.S), L = N(v.L);
      if (!OK(Vr)) return '<p class="muted">Введите площадь и высоту помещения или объём.</p>';
      const items = [kvI('Объём помещения', F(Vr, 1), 'м³')];
      if (OK(L) && OK(S) && S > 0) items.push(kvI('На 1 м² площади', F(L / S, 1), 'м³/(ч·м²)'));
      return kvBox(items);
    },
  },
  {
    id: 'heat', title: 'Мощность по разности температур', sum: 'Q = L · ρ · c · Δt', ref: 'воздухонагреватель, охладитель, теплоноситель',
    fields: [
      { k: 'med', l: 'Среда', t: 'sel', o: [['air', 'Воздух'], ['water', 'Вода']], d: 'air' },
      { k: 'rhoAt', l: 'Расход измерен', t: 'sel', o: [['in', 'на входе'], ['out', 'на выходе']], d: 'in', show: (v) => v.med === 'air' },
      { k: 'L', l: 'Расход', u: 'м³/ч', d: '' },
      { k: 't1', l: 't на входе', u: '°C', d: '' },
      { k: 't2', l: 't на выходе', u: '°C', d: '' },
    ],
    formula: 'Q = L · ρ · c · Δt / 3600, кВт;  воздух: c = 1,005 кДж/(кг·К), ρ = 353/(273 + t);  вода: c = 4,19 кДж/(кг·К)',
    calc(v) {
      const L = N(v.L), t1 = N(v.t1), t2 = N(v.t2);
      if (!OK(L) || !OK(t1) || !OK(t2)) return '<p class="muted">Введите расход и обе температуры.</p>';
      const dt = t2 - t1, air = v.med !== 'water';
      const tr = air ? (v.rhoAt === 'out' ? t2 : t1) : (t1 + t2) / 2;
      const rho = air ? 101325 / (287.05 * (273.15 + tr)) : waterRho(tr);
      const c = air ? 1.005 : 4.19;
      const G = L * rho, Q = G * c * dt / 3600;
      const items = [kvI('Δt', M.fmtSigned(dt, 1), '°C'), kvI('Плотность ρ', F(rho, air ? 3 : 1), `кг/м³ при ${F(tr, 1)} °C`),
        kvI('Массовый расход', air ? F(G, 0) : F(G / 1000, 2), air ? 'кг/ч' : 'т/ч'), kvI(air ? (dt >= 0 ? 'Мощность (нагрев воздуха)' : 'Мощность (охлаждение воздуха)') : (dt <= 0 ? 'Мощность (вода отдала)' : 'Мощность (вода получила)'), F(Math.abs(Q), 2), 'кВт', true)];
      items.push(air ? kvI('То же', F(Math.abs(Q) * 859.845, 0), 'ккал/ч') : kvI('То же', F(Math.abs(Q) * 0.000859845, 4), 'Гкал/ч'));
      return kvBox(items) + (air ? '<p class="hint">Для воздуха — явная теплота (без учёта влаги).</p>' : '');
    },
  },
  {
    id: 'units', title: 'Перевод единиц', sum: 'расход, скорость, давление, мощность, температура', ref: 'значение — во все единицы группы',
    fields: [
      { k: 'grp', l: 'Величина', t: 'sel', o: Object.entries(UNIT_GROUPS).map(([k, g]) => [k, g.t]), d: 'flow', w: 'span2' },
      { k: 'val', l: 'Значение', d: '1' },
      { k: 'unit', l: 'Единица', t: 'sel', o: (v) => (UNIT_GROUPS[v.grp] || UNIT_GROUPS.flow).u.map(([k, t]) => [k, t]), d: '' },
    ],
    formula: '',
    calc(v) {
      const g = UNIT_GROUPS[v.grp] || UNIT_GROUPS.flow, x = N(v.val);
      if (!OK(x)) return '<p class="muted">Введите значение.</p>';
      const nf = new Intl.NumberFormat('ru-RU', { maximumSignificantDigits: 6 });
      let rows;
      if (v.grp === 'temp') {
        const C = v.unit === 'F' ? (x - 32) * 5 / 9 : v.unit === 'K' ? x - 273.15 : x;
        rows = [['C', '°C', C], ['F', '°F', C * 9 / 5 + 32], ['K', 'K', C + 273.15]];
      } else {
        const base = x * ((g.u.find(([k]) => k === v.unit) || g.u[0])[2]);
        rows = g.u.map(([k, t, f]) => [k, t, base / f]);
      }
      return `<div class="tbl-wrap"><table class="unittbl"><tbody>${rows.map(([k, t, val]) => `<tr${k === v.unit ? ' class="cur"' : ''}><td class="r num">${nf.format(val)}</td><td>${t}</td></tr>`).join('')}</tbody></table></div>`;
    },
  },
];

const calcState = lsGet(LS_CALC) || {};
function calcVals(c) {
  const st = calcState[c.id] || {};
  const v = {};
  c.fields.forEach((f) => { v[f.k] = st[f.k] !== undefined ? st[f.k] : f.d; });
  c.fields.forEach((f) => { if (f.t === 'sel') { const opts = typeof f.o === 'function' ? f.o(v) : f.o; if (!opts.some(([x]) => x === v[f.k])) v[f.k] = opts[0][0]; } });
  return v;
}
function calcFieldsHTML(c, v) {
  const auto = c.auto ? c.auto(calcState[c.id] || {}) : '';
  return c.fields.filter((f) => !f.show || f.show(v)).map((f) => {
    const id = `c_${c.id}_${f.k}`;
    const label = `<label for="${id}">${lab(f.l, f.u)}</label>`;
    const hint = f.h ? `<span class="hint">${f.h}</span>` : '';
    let inp;
    if (f.t === 'sel') { const opts = typeof f.o === 'function' ? f.o(v) : f.o; inp = `<select id="${id}" data-calc="${c.id}" data-k="${f.k}" data-struct>${opts.map(([x, t]) => `<option value="${esc(x)}"${x === v[f.k] ? ' selected' : ''}>${esc(t)}</option>`).join('')}</select>`; }
    else if (f.t === 'list') inp = `<textarea id="${id}" data-calc="${c.id}" data-k="${f.k}" rows="2">${esc(v[f.k])}</textarea>`;
    else if (f.t === 'date') inp = `<input type="date" id="${id}" data-calc="${c.id}" data-k="${f.k}" value="${esc(v[f.k])}">`;
    else inp = `<input type="text" inputmode="decimal" class="num-in${auto === f.k ? ' auto' : ''}" id="${id}" data-calc="${c.id}" data-k="${f.k}" value="${esc(v[f.k])}" autocomplete="off">`;
    return `<div class="f ${f.w || ''}">${label}${inp}${hint}${auto && (f.k === auto) ? '<span class="hint auto-h">посчитано</span>' : ''}</div>`;
  }).join('');
}
function calcOut(c, v) { try { return c.calc(v); } catch (e) { return '<p class="muted">Проверьте введённые значения.</p>'; } }
function viewCalcs() {
  const cards = CALCS.map((c) => {
    const v = calcVals(c);
    const body = `<span class="ref" style="display:inline-block;margin-bottom:12px">${esc(c.ref)}</span>
      ${c.id === 'sect' ? `<div id="calc-src-box">${calcSrcHTML()}</div>` : ''}<div class="fields" id="cf-${c.id}">${calcFieldsHTML(c, v)}</div>
      ${c.formula ? `<div class="formula">${esc(c.formula)}</div>` : ''}
      <div class="out" id="co-${c.id}">${calcOut(c, v)}</div>`;
    return `<div id="calc-${c.id}" class="calc">${modCard('calc.' + c.id, 'c-' + (CALC_COLORS[c.id] || 'list'), esc(c.title), esc(c.sum || ''), body, modIsOpen('calc.' + c.id) ? `<button class="btn sm danger" data-act="calc-clear" data-id="${c.id}">Очистить</button>` : '')}</div>`;
  }).join('');
  return `<div class="stack"><div class="head"><div><h1>Расчёты</h1><p class="lead">Нажмите на расчёт, чтобы открыть. Булавка — держать открытым.</p></div></div>${cards}</div>`;
}
const CALC_COLORS = { sect: 'geom', flow: 'point', ach: 'list', heat: 'motor', units: 'note' };
function clearCalc(id) {
  const c = CALCS.find((x) => x.id === id); if (!c) return;
  const st = calcState[c.id] || (calcState[c.id] = {});
  c.fields.forEach((f) => { if (f.t !== 'sel') st[f.k] = ''; });
  delete st.src;
  lsSet(LS_CALC, calcState);
  const box = $('#calc-src-box'); if (box) box.innerHTML = calcSrcHTML();
  const v = calcVals(c);
  if (!$('#cf-' + c.id)) { render(); return; }
  $('#cf-' + c.id).innerHTML = calcFieldsHTML(c, v);
  $('#co-' + c.id).innerHTML = calcOut(c, v);
  const first = $('#cf-' + c.id + ' input'); if (first) first.focus();
}
function onCalcInput(el, structural) {
  const c = CALCS.find((x) => x.id === el.dataset.calc);
  if (!c) return;
  const st = calcState[c.id] || (calcState[c.id] = {});
  st[el.dataset.k] = el.value;
  if (c.sync) {
    const upd = c.sync(calcVals(c), el.dataset.k, st);
    Object.entries(upd).forEach(([k, val]) => { st[k] = val; const inp = document.getElementById(`c_${c.id}_${k}`); if (inp && inp !== el) inp.value = val; });
    if (c.auto && !structural) {
      const a = c.auto(st);
      $$(`#cf-${c.id} input[data-k]`).forEach((inp) => { const on = inp.dataset.k === a; inp.classList.toggle('auto', on); const f = inp.closest('.f'); const h = f && f.querySelector('.auto-h'); if (on && f && !h) f.insertAdjacentHTML('beforeend', '<span class="hint auto-h">посчитано</span>'); if (!on && h) h.remove(); });
    }
  }
  if (c.id === 'sect' && st.src && el.dataset.k !== 'drill') { delete st.src; const box = $('#calc-src-box'); if (box) box.innerHTML = calcSrcHTML(); }
  lsSet(LS_CALC, calcState);
  const v = calcVals(c);
  if (structural) {
    const box = $('#cf-' + c.id);
    const focusId = el.id;
    box.innerHTML = calcFieldsHTML(c, v);
    const f = document.getElementById(focusId); if (f) f.focus();
  }
  $('#co-' + c.id).innerHTML = calcOut(c, v);
}

/* ===== Размеры воздуховода из журнала: точка замера → расчёт сверления ===== */
const isDuctSec = (c) => c && (c.method === 'pitot' || c.method === 'anemo');
function secSizeText(c) { return c.shape === 'round' ? (c.D ? 'Ø' + c.D : '') : (c.a && c.b ? `${c.a}×${c.b}` : ''); }
function syncCalcFromSec(sys, sec) {
  if (!isDuctSec(sec)) return;
  const st = calcState.sect || (calcState.sect = {});
  st.shape = sec.shape === 'round' ? 'round' : 'rect';
  if (st.shape === 'round') st.D = String(sec.D ?? ''); else { st.a = String(sec.a ?? ''); st.b = String(sec.b ?? ''); }
  st.src = { sid: sys.id, cid: sec.id };
  lsSet(LS_CALC, calcState);
}
function ductPoints() {
  const out = [];
  Store.all('system').forEach((sys) => (sys.sections || []).forEach((c) => {
    if (isDuctSec(c) && secSizeText(c)) out.push({ sys, c, o: objOf(sys.objectId) });
  }));
  return out;
}
function calcSrcHTML() {
  const st = calcState.sect || {};
  const list = ductPoints();
  if (!list.length) return '<p class="hint" style="margin-bottom:10px">Размеры воздуховода, вписанные в точках замера (трубка Пито, анемометр в воздуховоде), появятся здесь сами.</p>';
  const cur = st.src ? `${st.src.sid}|${st.src.cid}` : '';
  const opts = [['', '— вручную —']].concat(list.map(({ sys, c, o }) => [`${sys.id}|${c.id}`, `${o && o.name ? o.name + ' · ' : ''}${sys.name || 'Система'} · № ${c.no || ''}${c.place ? ' ' + c.place : ''} · ${secSizeText(c)}`]));
  const src = list.find(({ sys, c }) => cur === `${sys.id}|${c.id}`);
  return `<div class="f calc-src"><label for="calc-src">Размеры из точки замера</label><select id="calc-src">${opts.map(([v, t]) => `<option value="${esc(v)}"${v === cur ? ' selected' : ''}>${esc(t)}</option>`).join('')}</select>
    ${src ? `<button class="linkbtn" data-act="to-sec" data-sid="${src.sys.id}" data-cid="${src.c.id}">← к точке № ${esc(src.c.no || '')}</button>` : ''}</div>`;
}
function applyCalcSrc(val) {
  const st = calcState.sect || (calcState.sect = {});
  if (!val) { delete st.src; lsSet(LS_CALC, calcState); }
  else { const [sid, cid] = val.split('|'); const sys = sysOf(sid); const c = sys && secOf(sys, cid); if (c) syncCalcFromSec(sys, c); }
  const y = window.scrollY; render(); window.scrollTo(0, y);
}

/* ===== выгрузка: таблица Excel, сводка с фото, резервная копия ===== */
function fileSafe(s) { return String(s || '').replace(/[\\/:*?"<>|]+/g, '-').replace(/\s+/g, ' ').trim().slice(0, 60) || 'объект'; }
function csvCell(x) { const s = String(x ?? ''); return /[;"\n]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s; }
const rnd = (x, d = 0) => (OK(x) ? Math.round(x * Math.pow(10, d)) / Math.pow(10, d) : '');

  paths.forEach((p) => {

  L.photos = L.photos || {};
  ['scheme', 'fan', 'motor', 'note'].forEach((slot) => {
    const r = mergePhotoList(L.photos[slot], (R.photos || {})[slot], L.delPh, dropped);
    L.photos[slot] = r.list; st.photos += r.added;

  /* точки */

  const byId = new Map(secs.map((c) => [c.id, c]));
  let prevId = null;

    const lc = byId.get(rc.id);
    if (lc) {
      const ph = mergePhotoList(lc.photos, rc.photos, L.delPh, dropped);

function mergeDocs(docs) {
  const st = { newObj: 0, newSys: 0, newPts: 0, updPts: 0, delPts: 0, delSys: 0, fields: 0, photos: 0, names: [] };
  docs.filter((d) => d.kind === 'object').forEach((R) => {
    let L = Store.get(R.id);
    st.names.push(R.name || 'Объект');
    if (!L && hasPdv(R) && !docs.some((d) => d.kind === 'system' && d.objectId === R.id)) {
      /* файл из блокнота ПДВ: тот же объект по названию — противодымную часть кладём в него */
      const same = Store.all('object').find((x) => normH(x.name) === normH(R.name) && !hasPdv(x));
      if (same) { PDV_FIELDS.forEach((k) => { if (R[k] !== undefined) same[k] = R[k]; }); Store.save(same); st.pdv = (st.pdv || 0) + 1; return; }
    }
    if (!L) { Store.save(R); st.newObj++; return; }
    if (hasPdv(R) && (!hasPdv(L) || (R.updatedAt || 0) > (L.updatedAt || 0))) { PDV_FIELDS.forEach((k) => { if (R[k] !== undefined) L[k] = R[k]; }); st.pdv = (st.pdv || 0) + 1; }
    st.fields += mergeFields(L, R, OBJ_FIELDS);
    L.delSys = mergeTombs(L.delSys, R.delSys);
    Store.save(L);
  });
  docs.filter((d) => d.kind === 'system' && typeof d.objectId === 'string').forEach((R) => {
    if (!Array.isArray(R.sections)) R.sections = [];
    const L = Store.get(R.id);
    const o = Store.get(R.objectId);
    const tomb = o && o.delSys && o.delSys[R.id];
    if (!L) {
      if (tomb && tomb >= sysStamp(R)) return;
      Store.save(R); st.newSys++; st.newPts += R.sections.length; return;
    }
    mergeSystem(L, R, st);
    Store.save(L);
  });
  /* системы, удалённые у напарника */
  docs.filter((d) => d.kind === 'object').forEach((R) => {
    const o = Store.get(R.id);
    Object.entries((o && o.delSys) || {}).forEach(([sid, ts]) => {
      const s = Store.get(sid);

}

function importBackup(file) {
  if (/\.xlsx$/i.test(file.name || '') || /spreadsheetml/.test(file.type || '')) { importTemplate(file); return; }
  if (/\.pdf$/i.test(file.name || '') || /pdf/.test(file.type || '')) {
    const r = UI.route, sd = r.sid ? Store.get(r.sid) : null, oid = r.oid || (sd && sd.objectId) || null;
    if (window.__pdv && window.__pdv.importPdf) window.__pdv.importPdf(file, UI.tab === 'journal' && r.name !== 'objects' ? oid : null);
    else toast('PDF здесь не читается.');
    return;
  }
  const rd = new FileReader();
  rd.onload = () => {
    try {
      const o = JSON.parse(String(rd.result));
      const pdvFile = o && o.app === 'blocknot-pdv';
      const docs = ((o && Array.isArray(o.docs)) ? o.docs : []).filter((d) => d && typeof d.id === 'string' && /^[A-Za-z0-9_\-.~:@+]{2,80}$/.test(d.id) && (d.kind === 'object' || (d.kind === 'system' && !pdvFile)));
      if (!docs.length) { toast('В файле нет записей блокнота.'); return; }
      /* фото ПДВ из файла — в память телефона */
      if (Local.ok) docs.filter((d) => d.kind === 'object').forEach((d) => pdvPhotos(d).forEach((p) => {
        if (!p || !p.data) return;
        try { const b = dataURLToBlob(p.data); const key = newId('b'); Local.putBlob(key, b).catch(() => {}); Photos.urls.set(key, URL.createObjectURL(b)); p.local = key; delete p.data; delete p.id; } catch (e) { /* оставить как есть */ }
      }));
      /* фото из файла — в память телефона */
      if (Local.ok) docs.filter((d) => d.kind === 'system').forEach((d) => {
        /* фото, которые уже есть в телефоне (та же метка), второй раз не сохраняем */
        const cur = Store.get(d.id), known = new Set(cur ? allPhotos(cur).map((p) => String(p.t)) : []);
        photoArrays(d).forEach((arr) => arr.forEach((p) => {
        if (!p || !p.data) return;
        if (!p.t) p.t = photoStamp();
        if (known.has(String(p.t))) return;
        try { const b = dataURLToBlob(p.data); const key = newId('b'); Local.putBlob(key, b).catch(() => {}); Photos.urls.set(key, URL.createObjectURL(b)); p.local = key; delete p.data; delete p.id; } catch (e) { /* оставить как есть */ }
        }));
      });
      const st = mergeDocs(docs);
      const parts = [];
      if (st.newObj) parts.push(`новых объектов ${st.newObj}`);
      if (st.newSys) parts.push(`новых систем ${st.newSys}`);
      if (st.newPts) parts.push(`новых точек ${st.newPts}`);
      if (st.updPts) parts.push(`обновлено точек ${st.updPts}`);
      if (st.delPts) parts.push(`удалено точек ${st.delPts}`);
      if (st.delSys) parts.push(`удалено систем ${st.delSys}`);
      if (st.fields) parts.push(`обновлено полей ${st.fields}`);
      if (st.photos) parts.push(`новых фото ${st.photos}`);
      if (st.pdv) parts.push(`противодымная часть: объектов ${st.pdv}`);
      const who = o && o.kind === 'object' && st.names.length === 1 ? `«${st.names[0]}»: ` : '';
      toast(parts.length ? who + parts.join(', ') + '.' : who + 'новых данных нет — всё уже есть.');
      render();
      Store.kick();
    } catch (e) { toast('Не удалось прочитать файл: это не файл блокнота.'); }
  };
  rd.readAsText(file);
}

/* ===== PDF для заказчика: страницы рисуются на canvas (JPEG) и собираются в PDF — без интернета ===== */
function pdfHexText(s) { let h = '<FEFF'; for (const ch of String(s)) { const c = ch.codePointAt(0); if (c > 0xFFFF) { const v = c - 0x10000; h += (0xD800 + (v >> 10)).toString(16).padStart(4, '0') + (0xDC00 + (v & 0x3FF)).toString(16).padStart(4, '0'); } else h += c.toString(16).padStart(4, '0'); } return h.toUpperCase() + '>'; }
function pdfFromJpegs(pages, title) {
  const enc = new TextEncoder(), parts = [], offs = [];
  let pos = 0;
  const push = (x) => { const u = typeof x === 'string' ? enc.encode(x) : x; parts.push(u); pos += u.length; };
  const obj = (n, body) => { offs[n] = pos; push(n + ' 0 obj\n'); body(); push('\nendobj\n'); };
  const W = 595.28, H = 841.89, n = pages.length, d = new Date();
  const ts = 'D:' + d.getFullYear() + [d.getMonth() + 1, d.getDate(), d.getHours(), d.getMinutes(), d.getSeconds()].map((x) => String(x).padStart(2, '0')).join('');
  push('%PDF-1.4\n%âãÏÓ\n');
  obj(1, () => push('<< /Type /Catalog /Pages 2 0 R >>'));
  obj(2, () => push(`<< /Type /Pages /Count ${n} /Kids [${pages.map((_, i) => `${4 + 3 * i} 0 R`).join(' ')}] >>`));
  obj(3, () => push(`<< /Title ${pdfHexText(title)} /Producer (Bloknot naladchika) /CreationDate (${ts}) >>`));
  pages.forEach((p, i) => {
    const po = 4 + 3 * i, co = po + 1, io = po + 2, cs = `q ${W} 0 0 ${H} 0 0 cm /Im${i} Do Q`;
    obj(po, () => push(`<< /Type /Page /Parent 2 0 R /MediaBox [0 0 ${W} ${H}] /Resources << /XObject << /Im${i} ${io} 0 R >> /ProcSet [/PDF /ImageC] >> /Contents ${co} 0 R >>`));
    obj(co, () => { push(`<< /Length ${cs.length} >>\nstream\n`); push(cs); push('\nendstream'); });
    obj(io, () => { push(`<< /Type /XObject /Subtype /Image /Width ${p.w} /Height ${p.h} /ColorSpace /DeviceRGB /BitsPerComponent 8 /Filter /DCTDecode /Length ${p.bytes.length} >>\nstream\n`); push(p.bytes); push('\nendstream'); });
  });
  const total = 4 + 3 * n, xref = pos;
  push(`xref\n0 ${total}\n0000000000 65535 f \n`);
  for (let k = 1; k < total; k++) push(String(offs[k]).padStart(10, '0') + ' 00000 n \n');
  push(`trailer\n<< /Size ${total} /Root 1 0 R /Info 3 0 R >>\nstartxref\n${xref}\n%%EOF\n`);
  return new Blob(parts, { type: 'application/pdf' });
}

/* Фото — уменьшенная копия под размер на странице (бережём память телефона) */
async function pdfThumb(p, maxW, maxH) {
  const b = await photoBlob(p).catch(() => null);
  if (!b) return null;
  const url = URL.createObjectURL(b);
  try {
    const img = await new Promise((res, rej) => { const i = new Image(); i.onload = () => res(i); i.onerror = rej; i.src = url; });
    const k = Math.min(maxW / img.naturalWidth, maxH / img.naturalHeight);
    const cv = document.createElement('canvas');
    cv.width = Math.max(1, Math.round(img.naturalWidth * k)); cv.height = Math.max(1, Math.round(img.naturalHeight * k));
    cv.getContext('2d').drawImage(img, 0, 0, cv.width, cv.height);
    return cv;
  } catch (e) { return null; } finally { URL.revokeObjectURL(url); }
}

/* ===== Паспорт системы (форма прил. Е СП 73.13330): общий для общеобменной и противодымной =====
   d = { name, obj, addr, zone, purpose, loc,
         fan: { p: [тип, N, D, L, P, шкив, n], f: [...] }, motor: { p: [тип, кВт, фаз, А, n, шкив, рег, передача], f: [...] },
         rows: [[№, помещение, факт, проект, невязка]], concl: [строки выводов], schemes: async (maxW, maxH) => [canvas] } */
async function passportsPDF(list, title) {
  const DPI = 150, MM = DPI / 25.4, PT = DPI / 72;
  const PW = Math.round(210 * MM), PH = Math.round(297 * MM);
  const ML = 15 * MM, MR = 10 * MM, MT = 12 * MM, MB = 14 * MM, CW = PW - ML - MR, BOTTOM = PH - MB;
  const FAM = 'Arial, Roboto, "Helvetica Neue", Helvetica, sans-serif';

  const pages = [[]];

  const need = (h) => { if (y + h > BOTTOM && y > MT + 1) newPage(); };
  const dash = (v) => (String(v ?? '').trim() ? String(v).trim() : '—');

    ctx.font = fl; const lw = ctx.measureText(label + ' ').width;
    const lines = wrap(dash(value), CW - lw, fv);
    lines.forEach((ln, i) => {
      need(lh); const yy = y;
      cur().push(() => {
        ctx.font = fl; ctx.fillStyle = '#111'; if (!i) ctx.fillText(label, ML, yy);
        ctx.font = fv; ctx.fillText(ln, ML + lw, yy);
        ctx.strokeStyle = '#777'; ctx.lineWidth = 1; ctx.beginPath(); ctx.moveTo(ML + lw, yy + pt * PT * 1.12); ctx.lineTo(ML + CW, yy + pt * PT * 1.12); ctx.stroke();

  }

  function table(head, rows, widths, o = {}) {
    const pt = o.pt || 8, fh = font(pt, true), fb = font(pt), pad = 1.3 * MM, lh = pt * PT * 1.22;
    const tot = widths.reduce((a, b) => a + b, 0), ws = widths.map((w) => (w / tot) * CW);
    const xs = ws.reduce((a, w, i) => (a.push(a[i] + w), a), [ML]);
    const layRow = (r, f) => { const cells = r.map((c, i) => wrap(c, ws[i] - 2 * pad, f)); return { cells, h: Math.max(...cells.map((c) => c.length)) * lh + 2 * pad }; };
    const drawRow = (lr, f, bg) => {
      need(lr.h); const yy = y;
      cur().push(() => {
        if (bg) { ctx.fillStyle = bg; ctx.fillRect(ML, yy, CW, lr.h); }
        ctx.strokeStyle = '#444'; ctx.lineWidth = 1;
        lr.cells.forEach((lines, i) => {
          ctx.strokeRect(xs[i], yy, ws[i], lr.h);
          ctx.font = f; ctx.fillStyle = '#111';
          const left = i === 0 || (o.align && o.align[i] === 'l');
          const top = yy + pad + (lr.h - 2 * pad - lines.length * lh) / 2;
          lines.forEach((ln, k) => { ctx.textAlign = left ? 'left' : 'center'; ctx.fillText(ln, left ? xs[i] + pad : xs[i] + ws[i] / 2, top + k * lh); });
          ctx.textAlign = 'left';
        });
      });
      y += lr.h;
    };
    const H = head.map((r) => layRow(r, fh));
    const hh = H.reduce((a, r) => a + r.h, 0);
    need(hh + (rows.length ? layRow(rows[0], fb).h : 0));
    H.forEach((r) => drawRow(r, fh, '#EEF1F3'));
    rows.forEach((r) => { const lr = layRow(r, fb); if (y + lr.h > BOTTOM) { newPage(); H.forEach((h) => drawRow(h, fh, '#EEF1F3')); } drawRow(lr, fb); });
    y += 1.5 * MM;
  }
  function sign(label) {

    para(label, 9, { after: 0 });
    const yy = y + 3 * MM;
    cur().push(() => {
      ctx.strokeStyle = '#555'; ctx.lineWidth = 1; ctx.beginPath(); ctx.moveTo(ML + CW * 0.45, yy); ctx.lineTo(ML + CW, yy); ctx.stroke();
      ctx.font = font(7); ctx.fillStyle = '#666'; ctx.textAlign = 'center'; ctx.fillText('(подпись, инициалы, фамилия)', ML + CW * 0.725, yy + 1 * MM); ctx.textAlign = 'left';
    });
    y += 7 * MM;
  }

  for (let n = 0; n < list.length; n++) {
    const d = list[n];
    if (n) newPage();
    para('ПАСПОРТ', 13, { bold: true, center: true, after: 0 });
    para('системы вентиляции (системы кондиционирования воздуха)', 10, { center: true, after: 4 });
    field('Наименование системы, установки', d.name);
    field('Объект', d.obj);
    field('Адрес', d.addr);
    field('Зона, цех, помещения', d.zone);
    para('Общие сведения:', 10, { bold: true, after: 0.5 });
    field('1. Назначение системы', d.purpose);
    field('2. Местонахождение оборудования системы', d.loc);
    y += 1 * MM;
    para('Е.1 Основные технические характеристики оборудования системы', 10, { bold: true, after: 1 });
    para('Таблица Е.1.1 — Вентилятор', 9, { after: 0.5 });
    table([['Данные', 'Тип', 'N', 'Диаметр рабочего колеса, мм', 'Расход, м³/ч', 'Полное давление, Па', 'Диаметр шкива, мм', 'Частота вращения, об/мин']],
      [['По проекту'].concat(d.fan.p.map(dash)), ['Фактически'].concat(d.fan.f.map(dash))], [13, 22, 7, 12, 11, 11, 10, 12]);
    para('Таблица Е.1.2 — Электродвигатель', 9, { after: 0.5 });
    table([['Данные', 'Тип', 'Мощность, кВт', 'Фазность', 'Ток, А', 'Частота вращения, об/мин', 'Диаметр шкива, мм', 'Наличие частотного регулятора', 'Вид передачи']],
      [['По проекту'].concat(d.motor.p.map(dash)), ['Фактически'].concat(d.motor.f.map(dash))], [13, 16, 10, 9, 10, 11, 9, 13, 10]);
    table([['Таблица', 'Оборудование', 'Примечание']],
      [['Е.1.3', 'Воздухонагреватели, в том числе зональные', 'отсутствует'], ['Е.1.4', 'Воздухоохладители', 'отсутствует'], ['Е.1.5', 'Увлажнитель', 'отсутствует'],
        ['Е.1.6', 'Теплоутилизатор', 'отсутствует'], ['Е.1.7', 'Воздушно-тепловые завесы', 'отсутствует'], ['Е.1.8', 'Пылегазоулавливающее устройство', 'отсутствует']],
      [12, 58, 30], { align: [null, 'l', null], pt: 7.5 });
    para('Е.2 Расходы воздуха по помещениям (по сети)', 10, { bold: true, after: 0.5 });
    para('Таблица Е.2 — Расход воздуха по помещениям', 9, { after: 0.5 });
    table([['Номер мерного сечения', 'Наименование помещений', 'Расход воздуха фактически, м³/ч', 'Расход воздуха по проекту, м³/ч', 'Невязка, % отклонения от показателей']],
      d.rows.length ? d.rows.map((r) => r.map(dash)) : [['—', 'точек нет', '—', '—', '—']], [11, 47, 13, 13, 16], { align: [null, 'l'] });
    para('Выводы:', 10, { bold: true, after: 0.5 });
    { let k = 0; d.concl.forEach((t) => para(/^Примечание/.test(t) ? t : `${++k}. ${t}`, 9, { after: 0.3 })); }
    y += 2 * MM;
    need(34 * MM); /* подписи — одним блоком, не разрывать */
    sign('Представитель застройщика или технического заказчика (наладочной организации)');
    sign('Представитель лица, осуществляющего подготовку проектной документации');
    sign('Представитель монтажной (строительной) организации');
    /* Е.3 — схема отдельной страницей */
    const AH = BOTTOM - MT - 12 * MM;
    const sch = d.schemes ? await d.schemes(AH, AH).catch(() => []) : [];
    for (let k = 0; k < sch.length; k++) {
      let c = sch[k];
      /* горизонтальная схема — поворачиваем, чтобы заняла лист */
      if (c.width > c.height * 1.1) { const r = document.createElement('canvas'); r.width = c.height; r.height = c.width; const rx = r.getContext('2d'); rx.translate(0, r.height); rx.rotate(-Math.PI / 2); rx.drawImage(c, 0, 0); c = r; }
      const s = Math.min(CW / c.width, AH / c.height), w = c.width * s, h = c.height * s;

      para(`Е.3 Схема системы вентиляции (системы кондиционирования воздуха) ${d.name}${sch.length > 1 ? `, лист ${k + 1}` : ''}`, 10, { bold: true, after: 2 });
      const yy = y, x = ML + (CW - w) / 2, img = c;
      cur().push(() => { ctx.drawImage(img, x, yy, w, h); ctx.strokeStyle = '#C9CFD4'; ctx.strokeRect(x, yy, w, h); });

  }

  for (let i = 0; i < total; i++) {
    ctx.setTransform(1, 0, 0, 1, 0, 0);
    ctx.fillStyle = '#fff'; ctx.fillRect(0, 0, PW, PH);
    ctx.textBaseline = 'top';
    pages[i].forEach((fn) => fn());
    ctx.font = font(7); ctx.fillStyle = '#888';
    const pg = `стр. ${i + 1} из ${total}`; ctx.fillText(pg, PW - MR - ctx.measureText(pg).width, PH - MB + 5 * MM);
    const blob = await new Promise((res) => cv.toBlob(res, 'image/jpeg', 0.85));

    out.push({ w: PW, h: PH, bytes: new Uint8Array(await blob.arrayBuffer()) });
  }
  return pdfFromJpegs(out, title);
}
/* выводы по точкам: допуск ±tol %, ссылка на норму */
function passportConcl(name, rows, tol, ref) {

  const bad = devs.filter((x) => Math.abs(x) > tol).length;
  return [
    bad ? `Отклонения показателей по воздуху превышают ±${tol} % от требуемых значений (${ref}) в ${bad} ${bad === 1 ? 'точке' : 'точках'}.`
      : `Отклонения показателей по воздуху в пределах ±${tol} % от требуемых значений согласно ${ref}.`,
    bad ? `Вентиляционная система ${name} не обеспечивает проектную воздухопроизводительность — требуется донастройка.`
      : `Вентиляционная система ${name} обеспечивает необходимую воздухопроизводительность и соответствует проекту.`,
    'Паспорт составлен согласно СП 73.13330.2016 «Внутренние санитарно-технические системы зданий», приложение Е.',
  ];
}
const pctStr = (f, p) => { const a = N(f), b = N(p); return OK(a) && OK(b) && b > 0 ? String(Math.round((a - b) / b * 1000) / 10).replace('.', ',') : ''; };
/* картинка (Blob) → canvas под размер */
async function blobCanvas(blob, maxW, maxH) {
  const url = URL.createObjectURL(blob);

    const k = Math.min(maxW / img.naturalWidth, maxH / img.naturalHeight, 1.5);
    const c = document.createElement('canvas'); c.width = Math.max(1, Math.round(img.naturalWidth * k)); c.height = Math.max(1, Math.round(img.naturalHeight * k));

/* Выводы по форме Е.2 СП 73.13330.2016 (изм. 2), п. 8.3.1 — по тем же допускам, что и оценка в блокноте */
function ventConcl(sys, res) {
  const SP = 'СП 73.13330.2016 (изм. 2), п. 8.3.1';
  const no = (s, i) => String(s.no || i + 1);
  const pt = (a) => (a.length === 1 ? 'в точке № ' : 'в точках № ') + list(a);
  const list = (a) => (a.length > 8 ? a.slice(0, 8).join(', ') + ' и др.' : a.join(', '));
  const pts = res.secs.map(({ s, r }, i) => ({ s, r, no: no(s, i), role: s.role || 'terminal' }));
  const net = pts.filter((p) => ['terminal', 'branch', 'main'].includes(p.role));
  const loc = pts.filter((p) => ['local', 'shower'].includes(p.role));
  const fan = pts.filter((p) => /^fan/.test(p.role));
  const bad = (a) => a.filter((p) => p.r.status === 'bad');
  const meas = (a) => a.filter((p) => p.r.status === 'ok' || p.r.status === 'bad');
  const out = [];

/* Чтение .xlsx без интернета: zip (stored / deflate) + XML листов */
async function unzipEntries(buf) {

  let e = u8.length - 22;
  while (e >= 0 && dv.getUint32(e, true) !== 0x06054b50) e--;
  if (e < 0) throw new Error('zip');
  const n = dv.getUint16(e + 10, true);
  let p = dv.getUint32(e + 16, true);
  const files = {};
  for (let i = 0; i < n && dv.getUint32(p, true) === 0x02014b50; i++) {
    const method = dv.getUint16(p + 10, true), csize = dv.getUint32(p + 20, true), nlen = dv.getUint16(p + 28, true), xlen = dv.getUint16(p + 30, true), clen = dv.getUint16(p + 32, true), off = dv.getUint32(p + 42, true);
    files[dec.decode(u8.subarray(p + 46, p + 46 + nlen))] = { method, csize, off };
    p += 46 + nlen + xlen + clen;
  }
  async function read(name) {
    const f = files[name] || files[name.replace(/^\//, '')];
    if (!f) return null;
    const start = f.off + 30 + dv.getUint16(f.off + 26, true) + dv.getUint16(f.off + 28, true);
    const data = u8.subarray(start, start + f.csize);
    if (f.method === 0) return dec.decode(data);
    if (f.method === 8) {
      if (typeof DecompressionStream === 'undefined') throw new Error('nodeflate');
      return new Response(new Blob([data]).stream().pipeThrough(new DecompressionStream('deflate-raw'))).text();
    }
    throw new Error('zipmethod');
  }
  return { read };
}
async function readXLSX(file) {
  const z = await unzipEntries(await file.arrayBuffer());
  const P = new DOMParser();
  const xml = async (n) => { const t = await z.read(n); return t ? P.parseFromString(t, 'application/xml') : null; };
  const tags = (node, name) => Array.from(node.getElementsByTagNameNS('*', name));
  const ss = [];
  const sst = await xml('xl/sharedStrings.xml');
  if (sst) tags(sst, 'si').forEach((si) => ss.push(tags(si, 't').filter((t) => !(t.parentNode && t.parentNode.localName === 'rPh')).map((t) => t.textContent).join('')));

  if (!wb) throw new Error('xlsx');
  const relMap = {};
  if (rels) tags(rels, 'Relationship').forEach((r) => { relMap[r.getAttribute('Id')] = r.getAttribute('Target'); });
  const out = [];
  for (const sh of tags(wb, 'sheet')) {
    const rid = sh.getAttribute('r:id') || Array.from(sh.attributes).find((a) => a.localName === 'id')?.value;
    let target = relMap[rid] || '';
    target = target.startsWith('/') ? target.slice(1) : 'xl/' + target.replace(/^\.\//, '');
    const doc = await xml(target);
    if (!doc) continue;
    const rows = [];
    tags(doc, 'row').forEach((row) => {
      const ri = Number(row.getAttribute('r')) - 1;
      const cells = [];
      tags(row, 'c').forEach((c, ci) => {
        const ref = c.getAttribute('r') || '';
        const letters = (ref.match(/^[A-Z]+/) || [''])[0];
        const col = letters ? letters.split('').reduce((a, ch) => a * 26 + ch.charCodeAt(0) - 64, 0) - 1 : ci;
        const t = c.getAttribute('t'), v = tags(c, 'v')[0];
        let val = '';
        if (t === 's') val = ss[Number(v && v.textContent)] ?? '';
        else if (t === 'inlineStr') val = tags(c, 't').map((x) => x.textContent).join('');
        else if (t === 'str' || t === 'e') val = v ? v.textContent : '';
        else if (t === 'b') val = v && v.textContent === '1' ? 'да' : '';
        else if (v) { const x = Number(v.textContent); val = Number.isFinite(x) ? x : v.textContent; }
        cells[col] = val;
      });
      rows[Number.isFinite(ri) && ri >= 0 ? ri : rows.length] = cells;
    });
    out.push({ name: sh.getAttribute('name') || '', rows: Array.from(rows, (r) => r || []) });

}

    ${zs.length ? `<div class="zlist">${list}</div>` : '<div class="empty"><h2>Зон пока нет</h2><p class="lead">Создайте зону сами или сразу по этажам — в каждую попадут системы, у которых есть точка на этом этаже.</p></div>'}

      <button class="btn primary" data-act="zone-add">+ Зона</button>

function viewZone(o, z) {

  const rt = known.map(([, g]) => `<li><b>${esc(g.l)}</b> — ${esc(g.names.join(', '))}</li>`).join('') + (route.has('') && known.length ? `<li><b>место не указано</b> — ${esc(route.get('').names.join(', '))}</li>` : '');

function newObject(name) {
  const o = { id: newId('o'), kind: 'object', name: name || '', address: '', date: todayISO(), testKind: 'accept', ta: '', inst: [], sys: {}, rows: [], zones: [] };
  Store.save(o); return o;
}
/* новая строка: та же система, этаж на 1 больше, проект, частотник и решётка — как у предыдущей */
function newRow(o, prev, fixed = {}) {
  const r = { id: newId('r'), s: '', floor: '', place: '', m: 'L', proj: '', fact: '', d: '' };
  if (prev) {
    const pf = N(prev.floor);
    Object.assign(r, { s: prev.s || '', m: prev.m || 'L', proj: prev.proj || '', grille: prev.grille || '' });
    let nf = pf + 1;
    const has = (f) => rowsOf(o).some((x) => x.s === prev.s && N(x.floor) === f);
    while (OK(pf) && has(nf) && nf < pf + 300) nf++;
    r.floor = OK(pf) ? String(nf) : '';
  }
  Object.assign(r, fixed);
  if (r.s) { ensureSys(o, r.s); if (!prev && M.ROLES[roleOf(o, r.s)].m === 'P') r.m = 'P'; }
  rowsOf(o).push(r);
  Store.save(o);
  return r;
}

/* ===== перенос записей из прежнего блокнота: система с точками → строки таблицы ===== */
function migrateOld() {
  const syss = Store.all('system');
  const objs = Store.all('object');
  let n = 0;
  objs.forEach((o) => {
    const mine = syss.filter((s) => s.objectId === o.id);
    if (Array.isArray(o.rows) && !mine.length && !(o.zones || []).some((z) => z.sys)) return;
    const rows = rowsOf(o), map = sysMap(o), byId = {}, used = new Set();
    mine.forEach((s) => {
      const base0 = String(s.name || '').trim() || 'Система';
      let name = base0, k = 2;
      while (used.has(name)) name = `${base0} (${k++})`;
      used.add(name); byId[s.id] = name;
      const kinds = (s.points || []).map((p) => p.kind);
      const role = s.type === 'kdu' ? 'kdu' : s.type === 'du' ? (kinds.includes('gas') ? 'gas' : kinds.includes('room') && !kinds.includes('corr') ? 'room' : 'corr')
        : kinds.includes('lift') ? 'lift' : kinds.some((k) => /^lock/.test(k)) ? 'lock' : kinds.some((k) => /^zone/.test(k)) ? 'mgn' : kinds.includes('stair') ? 'stair' : 'other';
      map[name] = Object.assign(map[name] || {}, { role, serves: s.serves || '', purpose: s.purpose || '', loc: s.loc || '', cab: s.cab || '', fan: s.fan || {}, motor: s.motor || {} });
      (s.points || []).forEach((p) => {
        const base = { s: name, floor: String(p.floor ?? ''), place: p.place || '', vfd: p.vfd || '', grille: (p.dev && p.dev.size) || '', note: p.note || '' };
        const press = ['p', 'p1lo', 'p1hi', 'p2', 'pUp', 'pDown'].filter((k) => String(p[k] ?? '').trim());
        if (/^(stair|lift|lockClosed|lockOpen|zoneClosed|zoneOpen)$/.test(p.kind || '') && (press.length || !String(p.L ?? '').trim())) {
          (press.length ? press : ['p']).forEach((k, i) => rows.push(Object.assign({ id: newId('r'), m: 'P', proj: '', fact: String(p[k] ?? ''), d: p.Ld || '' }, base, i ? { note: '' } : {})));
        } else {
          const hist = (p.hist || []).filter((x) => String(x.L ?? '').trim()).map((x) => ({ v: String(x.L), d: x.d || '' }));
          rows.push(Object.assign({ id: newId('r'), m: 'L', proj: String(p.Lreq ?? ''), fact: String(p.L ?? p.Q ?? ''), d: p.Ld || '', hist }, base));
        }
      });
    });
    mine.forEach((s) => { if (s.pair && byId[s.pair]) map[byId[s.id]].pair = byId[s.pair]; });
    o.zones = zonesOf(o).map((z) => {
      if (!z.sys) return z;
      const members = Object.keys(z.sys).map((id) => byId[id]).filter(Boolean);
      const done = {}; Object.entries(z.sys).forEach(([id, x]) => { if (x && x.done && byId[id]) done[byId[id]] = true; });
      return { id: z.id, name: z.name || '', floor: z.floor || '', members, done };
    });
    Store.save(o);
    mine.forEach((s) => Store.remove(s.id));
    n++;
  });
  /* системы без объекта */
  syss.filter((s) => !objs.some((o) => o.id === s.objectId)).forEach((s) => Store.remove(s.id));
  return n;
}

    const on = get(row, 'obj'), sn = get(row, 'sys');
    if (on && on !== cur.obj) cur = { obj: on, sys: '' };
    if (sn) cur.sys = sn;
    if (!cur.obj || !cur.sys) { st.skipped++; continue; }
    const o = objFor(cur.obj, get(row, 'addr'));
    st.objs.set(o.id, o);
    const name = Object.keys(sysMap(o)).find((x) => normH(x) === normH(cur.sys)) || cur.sys;
    const isNewSys = !sysMap(o)[name];
    const serves = get(row, 'serves');
    if (isNewSys) { sysMap(o)[name] = { role: M.guessRole(name, serves), serves: '' }; st.newSys++; }
    const si = sysMap(o)[name];
    let ch = false;
    const set = (obj, k, v) => { if (v === '') return; if (String(obj[k] ?? '') !== String(v)) { obj[k] = v; ch = true; } };
    set(si, 'serves', serves); set(si, 'loc', get(row, 'loc')); set(si, 'cab', get(row, 'cab')); set(si, 'pair', get(row, 'pair'));
    if (ptPurpose(si, name, get(row, 'pur'))) ch = true;
    else if (isNewSys && serves) si.role = M.guessRole(name, serves);
    const fanV = { type: get(row, 'ftype'), Lp: ptNum(get(row, 'fLp')), Pp: ptNum(get(row, 'fPp')), vfdP: get(row, 'vfd') };
    if (Object.values(fanV).some(Boolean)) { const f = si.fan || (si.fan = {}); Object.entries(fanV).forEach(([k, v]) => set(f, k, v)); }
    const kW = ptNum(get(row, 'kW'));
    if (kW) set(si.motor || (si.motor = {}), 'kW', kW);
    if (ch && !isNewSys) st.updSys.add(o.id + '|' + name);
    if (!o.lastSys) o.lastSys = name;
    /* точка */
    const floor = get(row, 'floor'), place = get(row, 'place'), atV = normH(get(row, 'at'));
    const at = PT_AT.find(([, t]) => normH(t) === atV) || (atV.startsWith('вент') ? (/нагн/.test(atV) ? PT_AT[3] : PT_AT[2]) : atV.startsWith('возд') ? PT_AT[1] : atV.startsWith('реш') ? PT_AT[0] : null);
    if (!floor && !place && !at) continue;
    const [atK, side] = at ? at[0].split(':') : ['', ''];
    let r = rowsOf(o).find((x) => x.s === name && fkey(x.floor) === fkey(floor) && normH(x.place) === normH(place) && (atK !== 'fan' || (x.at === 'fan' && fanSide(x) === side)));
    const isNew = !r;
    if (!r) { r = { id: newId('r'), s: name, floor, place, m: M.ROLES[roleOf(o, name)].m, proj: '', fact: '', d: '' }; rowsOf(o).push(r); }
    const was = JSON.stringify(r);
    if (atK) { r.at = atK; if (side) r.side = side; else delete r.side; }
    const pv = normH(get(row, 'pres'));
    if (pv) r.m = /^(да|yes|\+|1)/.test(pv) && r.at !== 'fan' ? 'P' : 'L';
    const proj = ptNum(get(row, 'proj')); if (proj) r.proj = proj;
    const g = get(row, 'grille'); if (g) r.grille = g;
    const k = ptNum(get(row, 'k')); if (k) r.k = k;
    const note = get(row, 'note'); if (note && !String(r.note || '').includes(note)) r.note = [r.note, note].filter(Boolean).join('; ');
    if (isNew) st.newPts++; else if (was !== JSON.stringify(r)) st.updPts++;
  }
  return st;
}

/* ===== связь с блокнотом вентиляции ===== */
window.__pdvKick = () => Photos.syncUploads();
window.__pdv = {
  render() {
    UI.tab = 'journal';
    const r = CORE.UI.route;
    if (r.oid && (!OBJ_ROUTES.includes(UI.route.name) || UI.route.oid !== r.oid)) { UI.route = { name: 'object', oid: r.oid }; UI.sheet = null; }
    render();
  },
  renderRef() { UI.tab = 'ref'; UI.sheet = null; render(); },
  open(oid) { if (UI.route.oid !== oid) UI.modOpen = {}; UI.route = { name: 'object', oid }; UI.sheet = null; },
  stats(o) {
    const rows = Array.isArray(o.rows) ? o.rows : [];
    const c = ptStats(rows, o);
    return { sys: Object.keys(o.sys || {}).length, pts: rows.length, ok: c.ok || 0, bad: c.bad || 0 };
  },
  photoArrays(o) { try { return allPhotosOf(o); } catch (e) { return []; } },
  annotate(blob, save) { return annOpenExt(blob, save); },
  annAct(act, a) { return annAct(act, a); },
  tplSheets: tplSheetsPdv,
  importXlsx(file) { UI.tab = 'journal'; UI.sheet = null; UI.route = { name: 'objects' }; return importXLSX(file); },
  importPdf(file, oid) { UI.tab = 'journal'; UI.sheet = null; if (oid) { UI.route = { name: 'object', oid }; } else UI.route = { name: 'objects' }; return importPassports(file); },
  tplImport: tplImportPdv,
  annClose() { if (!Ann.st) return false; Ann.st = null; annRoot().innerHTML = ''; return true; },
};
Store.on(() => {});
if (CORE.isPdv()) CORE.render();

})();
